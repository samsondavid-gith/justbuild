      {"kicker":"DEFINE GOOD FIRST","caselet":"Hands on","headline":"Decide your *criteria* before you read","steps":[{"title":"Pick 3 or 4 criteria","detail":"for example: years hands-on, the main tool, proof of impact, fit to the role"},{"title":"Make each scorable","detail":"a 0 to 3 you could defend, not a vague good feeling"},{"title":"Write them down now","detail":"then apply the same bar to all 25, or the ranking means nothing"}],"wrong":"Start reading and decide the criteria as you go. By resume 10 you are judging on a different bar than resume 1.","right":"Fix the criteria first, then apply the exact same grid to every resume.","note":{"label":"In practice","text":"This is the 'define good' habit from Humanics, done for real. The criteria you write now are the same ones that become the agent's scoring code later."},"bubble":"Set the bar. <b>Then judge.</b>"},
      {"kicker":"DO IT","caselet":"Hands on","headline":"Score *every* resume","lead":"Now the work. Go resume by resume, and for each one pull the few facts your criteria need and score them on your grid. Same process, all 25.","steps":[{"title":"Read for the facts","detail":"you are hunting your criteria, not reading every word"},{"title":"Score on the grid","detail":"one number per criterion, written down, for every resume"},{"title":"Do not rank yet","detail":"resist picking favourites; score all 25 first, fairly"}],"wrong":"Read each resume and form an overall gut impression. By the end you cannot say why one beat another.","right":"Score each criterion separately. The reasons are now on the page, not just in your head.","bubble":"Facts to the grid. <b>All twenty-five.</b>"},
      {"kicker":"PICK YOUR FIVE","caselet":"Hands on","headline":"Rank, then *choose five*","lead":"With every resume scored, add up the grid, rank them, and take the top five. Then, for each, write one line on why they made it.","steps":[{"title":"Total and rank","detail":"add the scores, order 1 to 25, top to bottom"},{"title":"Take the top five","detail":"and look hard at the sixth: the close call teaches you the most"},{"title":"Write one reason each","detail":"a single line per pick, grounded in the grid"}],"bubble":"Rank it. <b>Own your five.</b>"},
      {"kicker":"YOUR YARDSTICK","caselet":"Hands on","headline":"That list is your *yardstick*","lead":"Keep your five, with reasons. This is not just an exercise answer: it is the golden set your agent must reproduce, and the way you will know it works.","steps":[{"title":"Save it","detail":"your five names and the reason for each, written down"},{"title":"It is the test","detail":"when the agent runs, it should match this, or show you exactly where it differs"},{"title":"You now know 'good'","detail":"you did not guess it; you built it, by hand, one grid at a time"}],"bubble":"Your hand-made five. <b>The test to beat.</b>"},
      {"kicker":"WATCH WHAT YOU DID","caselet":"Hands on","headline":"Notice *what you just did*","steps":[{"title":"You read, then extracted","detail":"you took messy resumes and pulled out a few facts that mattered"},{"title":"You scored, then ranked","detail":"you applied a rule and ordered the results"},{"title":"You were a little inconsistent","detail":"tired by resume 20, you scored slightly differently than at resume 1"}],"note":{"label":"Worth noticing","text":"That last point is the whole reason we build the agent: it applies your rule the same way on resume 1 and resume 2,500. You bring the judgement; it brings the consistency."},"bubble":"You just ran <b>a pipeline.</b>"}
    ]

  "design": {
    "before_session": "5", "stage_number": "03", "stage_name": "Mechanics",
    "slides": [
      {"kicker":"FROM HAND TO AGENT","headline":"Turn *your process* into an agent","lead":"You just shortlisted 25 resumes by hand. Now we turn exactly what you did into an agent, one box at a time, on paper, before any code. When the design is right, the code is just typing.","steps":[{"title":"You already have the logic","detail":"the pipeline you ran by hand is the agent's blueprint"},{"title":"Design on paper","detail":"a page you could hand to a stranger to build is a finished design"},{"title":"One decision at a time","detail":"each box gets decided deliberately, with a wrong and a right way"}],"wrong":"Open Colab and wire cells together, discovering the design as you type. Halfway in the shape is wrong and you restart.","right":"Draw the whole agent on one page first, straight from what you did by hand. Then the build is just typing it out.","bubble":"You did it. <b>Now design it.</b>"},
      {"kicker":"NAME WHAT YOU DID","headline":"You already ran the *four moves*","steps":[{"title":"You read","detail":"each resume, messy and long"},{"title":"You extracted","detail":"the few facts your criteria needed"},{"title":"You decided","detail":"you scored each one and ranked them"},{"title":"You acted","detail":"you wrote your five, each with a reason"}],"note":{"label":"The link","text":"Read, extract, decide, act. You did all four by hand. Designing the agent is just deciding what does each move: the model, or code."},"bubble":"Same four moves. <b>Now on a machine.</b>"},
      {"kicker":"LAY OUT THE PIPELINE","headline":"Draw the *boxes*, ends first","steps":[{"title":"In","detail":"25 resumes and one job description, the pack you just worked from"},{"title":"Out","detail":"five names, ranked, each with its evidence: your yardstick list"},{"title":"The middle","detail":"read to extract, then decide, then draft: three agents between the two ends"}],"wrong":"Design the clever scoring first, then work out what feeds it. A brilliant engine with nowhere to put the fuel.","right":"Fix the two ends first. The middle then almost designs itself.","bubble":"Pin the ends. <b>The middle follows.</b>"},
      {"kicker":"AGENT 1: EXTRACT","headline":"Your *reading* becomes the extract","steps":[{"title":"List the facts you used","detail":"years hands-on, the main tool, proof of impact, fit: the same ones from your grid"},{"title":"Ask for them as clean data","detail":"named fields, same shape for every resume, ready to score"},{"title":"Nothing more","detail":"pull only what the decision needs, not a summary you cannot use"}],"wrong":"Tell the model to 'read the resume and summarise the candidate'. You get a paragraph you cannot score.","right":"Ask for the exact fields from your grid. Every resume returns the same clean shape.","note":{"label":"The link","text":"This is your 'read for the facts' step from the exercise, and the 'break into atoms' habit from Humanics, made concrete. Each field is one atom."},"bubble":"The facts you hunted. <b>Now as fields.</b>"},
      {"kicker":"AGENT 2: DECIDE","headline":"Your *scoring* becomes code","steps":[{"title":"Your criteria become weights","detail":"the columns of your grid, with the importance you gave each"},{"title":"Write the rule","detail":"score = experience by 3 + tool by 2 + impact by 2; rank; take the top five"},{"title":"Code, not the model","detail":"same fields in, same five out, every run, with the score visible"}],"wrong":"Ask the model to 'pick the best five'. It will, differently each run: the same inconsistency you had by hand.","right":"Code applies your grid to the clean fields. The same five, every time, and you can see why.","note":{"label":"The link","text":"This is 'define good' becoming the machine. Your grid was the definition; now it is the scoring code, which is why the by-hand step had to come first."},"bubble":"Your grid. <b>Now in code.</b>"},
      {"kicker":"THE HARD RULE","headline":"The rule you applied *without noticing*","lead":"By hand, you probably threw out anyone clearly ineligible before scoring, without even thinking of it as a rule. Make that explicit.","steps":[{"title":"Find your silent rule","detail":"the disqualifier you applied automatically, like a required qualification"},{"title":"State it as a gate","detail":"out of scope, rejected, whatever the score says"},{"title":"Put it in code","detail":"a rule you need held must be enforced, not left to the model"}],"wrong":"Trust the scoring to 'probably' filter out ineligible ones. One run, a strong-but-ineligible resume slips through.","right":"One line of code checks eligibility first and rejects out-of-scope resumes before scoring runs.","bubble":"Some things <b>never depend on a score.</b>"},
      {"kicker":"AGENT 3: DRAFT AND GATE","headline":"Your *shortlist* becomes a draft","steps":[{"title":"The output has your shape","detail":"five names, each with its score and evidence"},{"title":"The agent drafts, never sends","detail":"no candidate is contacted on the agent's own authority"},{"title":"A person approves","detail":"they see the evidence and own the decision, the same judgement you used"}],"wrong":"The agent emails the top five 'you are shortlisted' by itself. A wrong pick just contacted a real person.","right":"The agent produces the shortlist with evidence; a person reviews and decides who is actually contacted.","note":{"label":"The link","text":"This is the human gate from the Agents session, designed in from the start, not bolted on later."},"bubble":"Agent drafts. <b>Human decides.</b>"},
      {"kicker":"WHERE THE AGENT WINS","headline":"Better than you, and *worse than you*","steps":[{"title":"It beats you on consistency","detail":"resume 1 and resume 2,500 get the identical rule; you drifted by resume 20"},{"title":"It cannot beat your judgement","detail":"it only scores the criteria you chose; a factor you did not name, it cannot see"},{"title":"So you stay in the loop","detail":"you bring judgement and the exceptions; it brings scale and sameness"}],"note":{"label":"Worth knowing","text":"This is systems thinking: the agent is one part of a chain that still includes you. The design is only as good as the criteria and the gate you gave it."},"bubble":"It scales your rule. <b>Not your judgement.</b>"},
      {"kicker":"TRACE ONE THROUGH","headline":"Walk *one resume* through your design","steps":[{"title":"Pick a real one","detail":"ideally an awkward resume, not the clean ideal"},{"title":"Follow it box to box","detail":"what extract pulls, what the score comes to, whether the hard rule fires, what the human sees"},{"title":"The 'hmm' is a gap","detail":"any 'what happens here?' is a design bug found for free, before you built it"}],"note":{"label":"The link","text":"Your by-hand answer is the test. In code, the agent must reproduce your yardstick five exactly, or you learn where design and judgement differ."},"bubble":"Trace one. <b>Find gaps free.</b>"},
      {"kicker":"THE OBJECTION","headline":"If I can do it by hand, why *build it?*","lead":"Fair challenge: you just shortlisted 25 without any AI, so why bother building the agent at all? Take it seriously.","steps":[{"title":"25 you can do","detail":"by hand, in twenty minutes, and you just did"},{"title":"2,500 you cannot","detail":"not the same way, not consistently, not every week without burning out"},{"title":"The agent is your rule, at scale","detail":"it does exactly what you did, the same way, on any number, and never tires"}],"wrong":"Conclude the agent is pointless because the by-hand version worked. It worked for 25, once, on a good day.","right":"Build the agent to run your exact process on thousands, consistently. That is the whole point of the design.","bubble":"You, at scale. <b>Without the drift.</b>"},
      {"kicker":"YOUR TURN","caselet":true,"headline":"Draw the *whole* recruitment agent","lead":"You have designed each box in pieces. Now put it together on one page: the complete recruitment agent you just built by hand, from the 25 resumes in to the five names out.","steps":["Draw the *pipeline*, in to out","What does Agent 1 *extract?*","What *rule* does Agent 2 run, in code?","What is the *hard rule*, and where is the *gate?*"],"bubble":"One page. <b>The whole agent.</b>"},
      {"kicker":"THE ANSWER","caselet":true,"headline":"The recruitment agent, *on one page*","lead":"Here is the whole design, straight from what you did by hand.","steps":[{"title":"Extract","detail":"years hands-on, main tool, proof of impact, fit: the fields from your grid"},{"title":"The rule (code)","detail":"score = experience by 3 + tool by 2 + impact by 2; rank; take the top five"},{"title":"The hard rule","detail":"missing the required qualification gives rejected, whatever the score says"},{"title":"The gate","detail":"the agent drafts the five with evidence; a person approves who is contacted"}],"note":{"label":"A caveat","text":"The scores and the cut-off are exact, so the ranking is code. The model only reads each resume into clean fields; never let it do the scoring maths."},"bubble":"Your hand-made five. <b>Now an agent.</b>"},

      {"kicker":"WHAT IS GOOGLE COLAB","headline":"A notebook in your *browser*","steps":[{"title":"Nothing to install","detail":"it opens in a browser tab, like a document; no setup on your laptop"},{"title":"Code in blocks","detail":"you run one block at a time and read what each one prints"},{"title":"It runs in the cloud","detail":"the work happens on Google's computers, not yours"}],"wrong":"Assume you must install Python and set up your machine before anything works.","right":"Open one browser tab. Everything runs in the cloud; your laptop just shows it.","bubble":"Just a browser tab. <b>Nothing to install.</b>"},
      {"kicker":"YOUR JOB IN THE NOTEBOOK","headline":"You *run* and *read*","steps":[{"title":"Run each block in order","detail":"top to bottom; each one does a small, visible step"},{"title":"Read the output","detail":"watch what prints, not every character of code"},{"title":"You are not writing it","detail":"the code is written; your job is to follow the flow"}],"wrong":"Try to write or fully understand every line of code before you run it.","right":"Run the block, read what it produced, move on. Follow the flow, not the syntax.","bubble":"Run it. Read it. <b>Follow the flow.</b>"},
      {"kicker":"WHAT IS A GEMINI KEY","headline":"Your *pass* to the model","steps":[{"title":"The model is not on your laptop","detail":"it runs on Google's servers; your notebook has to reach out to it"},{"title":"The key is how you are let in","detail":"it proves the request is yours and is allowed to call the model"},{"title":"One request at a time","detail":"notebook sends text plus your key; Google runs the model and sends the answer back"}],"wrong":"Assume the AI runs inside the notebook on your own computer.","right":"The notebook sends each request, with your key, to Google's servers, and reads the answer.","bubble":"The model is remote. <b>The key calls it.</b>"},
      {"kicker":"KEEP YOUR KEY SAFE","headline":"Treat it like a *password*","steps":[{"title":"It is personal and free","detail":"tied to your Google account, and free for what we do today"},{"title":"Never share it","detail":"do not paste it in a chat, a screenshot, or shared code"},{"title":"A leaked key is your bill","detail":"anyone who has it can spend your quota in your name"}],"wrong":"Paste your key into a shared doc or a screenshot so others can copy it.","right":"Keep it private, in your own notebook only. If it ever leaks, delete it and make a new one.","note":{"label":"Why it matters","text":"A key is an identity, not just a setting. Sharing it is like handing someone your password: they act as you, on your account."},"bubble":"Yours only. <b>Never shared.</b>"},
      {"kicker":"OPEN THE NOTEBOOK","caselet":"Live","headline":"Now we *run it*","lead":"Screens up, eyes on the projector. I'll open the Colab notebook and drive. Watch the three agents you designed work on the exact 25 resumes you just ranked by hand.","bubble":"Here we go. <b>Watch it run.</b>"},
      {"kicker":"WATCH AGENT 1","caselet":"Live","headline":"Messy resumes to a *clean table*","steps":[{"title":"It reads all 25","detail":"the same reading you did by hand, now in seconds"},{"title":"It pulls the fields","detail":"years, tool, impact, fit: your grid, filled automatically"},{"title":"Watch the shape appear","detail":"twenty-five messy documents become one clean table"}],"bubble":"Your reading. <b>Now automatic.</b>"},
      {"kicker":"WATCH AGENT 2","caselet":"Live","headline":"Score, the *hard rule*, top five","steps":[{"title":"Code scores the table","detail":"your rubric, applied the same way to every row"},{"title":"The hard rule fires","detail":"anyone ineligible is rejected, whatever the score"},{"title":"The ranked five appear","detail":"same input, same five, with the reason visible"}],"bubble":"Your grid. <b>Now in code.</b>"},
      {"kicker":"WATCH AGENT 3","caselet":"Live","headline":"It drafts, it *does not send*","steps":[{"title":"It writes the recommendation","detail":"the five, with evidence, to the hiring manager"},{"title":"We read it aloud","detail":"and check it against the evidence on screen"},{"title":"It stays your call","detail":"nothing is sent; a human decides who is contacted"}],"bubble":"Agent drafts. <b>Human sends.</b>"},

  "valuenomics": {
    "before_session": "8", "stage_number": "05", "stage_name": "Valuenomics",
    "slides": [
      {"lens":"opener","headline":"A working agent is not the prize. The *outcome* is.","sub":"This session is about value: turning a built thing into a result, seeing the pattern across domains, and meeting the other agent patterns you will use out there.","chips":["Data to *outcome*","Value *patterns* everywhere","*Other* agent patterns","*Responsible* value"]},
      {"kicker":"STEP 1 · INSIGHT","headline":"Raw output is not value. The *insight* is.","lead":"'Here are 25 scores' is data. 'These three are clearly strongest, and here is why' is insight. The agent gives you the first; you find the second.","wrong":"A dump of 25 rows.","right":"'Three stand out on hands-on skill.'","bubble":"Data is cheap. <b>Insight sells.</b>"},
      {"kicker":"STEP 2 · NARRATIVE","headline":"Wrap the number in a *story.*","lead":"'It ranks resumes' is forgettable. 'It cut first-pass screening from two hours to two minutes' sticks. Same fact, one is simply told well.","wrong":"'My agent processes documents.'","right":"'A two-hour chore, now two minutes.'","bubble":"A number in a <b>story.</b>"},
      {"kicker":"STEP 3 · INFLUENCE","headline":"A story with *proof* moves people.","lead":"Show the by-hand time, the after, and the evidence. Proof is what makes a recruiter, a manager, or a panel actually act on what you say.","wrong":"'Trust me, it works.'","right":"'Here is the baseline, the run, and the matching picks.'","bubble":"Proof <b>moves</b> people."},
      {"kicker":"STEP 4 · OUTCOME","headline":"The point is the *outcome,* not the demo.","lead":"Hours saved, a better hire, a faster queue, an offer letter. Always tie the agent back to a result that someone actually cares about.","wrong":"'It is a cool project.'","right":"'It got me the interview, because I showed real work.'","bubble":"Demo is nice. <b>Outcome wins.</b>"},
      {"kicker":"THE PATTERN","headline":"The same shape is worth money *everywhere.*","lead":"Screen-and-rank fits resumes, invoices, tickets, leads, claims, incidents. Find a pile of similar things that needs sorting, and you have found value.","artifact":"three piles in your world worth an agent.","bubble":"Find the pile. <b>Find the value.</b>"},
      {"kicker":"BEYOND RANKING","headline":"Screen-and-rank is *one* pattern. Here are *five* more.","lead":"You now know the shape of every agent. Swap what each step does and you unlock a whole toolbox. The next slides are your menu.","bubble":"One shape. <b>Many jobs.</b>"},
      {"kicker":"PATTERN · EXTRACT & SUMMARISE","headline":"Turn *long* into *short.*","lead":"Feed it long documents, get back the five lines that matter. Meeting notes, contracts, research papers, call transcripts.","artifact":"where it wins: anything too long to read in full.","bubble":"Long in. <b>Short out.</b>"},
      {"kicker":"PATTERN · TRIAGE & ROUTE","headline":"Sort the flood, send each to the *right* place.","lead":"Read each incoming item and route it: this ticket to billing, this email to sales, this claim to the review pile.","artifact":"where it wins: a busy inbox or queue with many owners.","bubble":"Read it. <b>Route it.</b>"},
      {"kicker":"PATTERN · MONITOR & ALERT","headline":"Watch quietly, speak *only* when it matters.","lead":"Scan a stream of data or documents and raise a flag on the one thing that needs a human, right now, and stay silent otherwise.","artifact":"where it wins: rare but costly events hiding in noise.","bubble":"Quiet, until it <b>matters.</b>"},
      {"kicker":"PATTERN · DRAFT & REFINE","headline":"A strong *first draft,* every time.","lead":"Give it the facts and a purpose, get back a solid draft to edit instead of a blank page. Replies, reports, posts, proposals.","artifact":"where it wins: repetitive writing with a human final say.","bubble":"Never a <b>blank page.</b>"},
      {"kicker":"PATTERN · ANSWER FROM YOUR DOCS","headline":"Ask your *own* documents a question.","lead":"Point it at your policies, manuals, or notes and get grounded answers with sources, instead of a generic guess from the open web.","artifact":"where it wins: knowledge trapped in long internal docs.","bubble":"Your docs, <b>answering back.</b>"},
      {"kicker":"PATTERN · RESEARCH & COMPILE","headline":"Many small steps, *one* clean brief.","lead":"Break a big question into steps, gather from several places, and assemble a tidy summary. The agent that plans, not just answers.","artifact":"where it wins: questions no single document answers.","bubble":"It plans. <b>Then it answers.</b>"},
      {"kicker":"RESPONSIBLE VALUE","headline":"Value that lasts is *value you can defend.*","lead":"Fair criteria, evidence kept, a human on the big calls. The trustworthy agent is the one that survives scrutiny, and it is the one people keep using.","wrong":"'It is fast, ship it.'","right":"'It is fast, fair, and shows its work.'","bubble":"Fast, fair, <b>defensible.</b>"},
      {"lens":"opener","mascot":"butterfly","headline":"From a pile of files to an *outcome you can prove.*","sub":"Data to insight to narrative to influence to outcome. A toolbox of patterns, each with a place it wins. That is how a built thing becomes real value.","bubble":"Build the agent. <b>Prove the outcome.</b>"}
    ]
  },
  "whatnext": {
    "before_session": "9", "stage_number": "06", "stage_name": "What Next",
    "slides": [
      {"lens":"opener","headline":"You can build agents now. *Here is where that takes you.*","sub":"This last stretch is about the road ahead: how to spot opportunities, how to keep building, how to turn this into something real, and the mindset that outlasts any tool.","chips":["Spot *opportunities*","Keep *building*","Make it *real*","The *mindset*"]},
      {"kicker":"THE SKILL YOU HAVE","headline":"You can turn a *task* into a *worker.*","lead":"That is rarer than it sounds. Most people still see AI as a chat box. You now look at any repetitive, judgement-based task and think: I could build an agent for that.","bubble":"You see agents <b>everywhere</b> now."},
      {"kicker":"SPOT OPPORTUNITIES","headline":"Look for the *boring, repeated* work.","lead":"The best agent ideas are unglamorous: the report someone rebuilds every Monday, the inbox someone sorts by hand, the list someone re-checks. Boring and repeated is gold.","artifact":"one boring, repeated task near you, worth an agent.","bubble":"Boring + repeated = <b>opportunity.</b>"},
      {"kicker":"SPOT OPPORTUNITIES","headline":"Follow the *pain,* not the hype.","lead":"Do not build the flashiest agent. Build the one that removes a real, felt annoyance for a real person. Pain is a far better compass than the latest trend.","wrong":"'Let me build something with the newest model.'","right":"'Let me remove the thing my uncle complains about every week.'","bubble":"Chase the <b>pain.</b>"},
      {"kicker":"KEEP BUILDING","headline":"Build *ten small* agents, not one perfect one.","lead":"Range beats polish early. Ten small working agents across ten tasks will teach you more, and show more, than one you endlessly refine.","bubble":"Ten small &gt; <b>one perfect.</b>"},
      {"kicker":"KEEP BUILDING","headline":"Every build, add *one* new piece.","lead":"This build taught you structured output. Next, add a hard rule. Then memory. Then a tool. Then chaining. Grow your toolkit one project at a time, driven by need.","artifact":"the one new thing your next agent will add.","bubble":"One new piece <b>each time.</b>"},
      {"kicker":"LEVEL UP","headline":"The next frontiers, in *plain words.*","lead":"Memory: it remembers past runs. Tools: it can search, calculate, or call an API. Planning: it breaks a big task into steps on its own. Learn each when a real project asks for it.","bubble":"Memory. Tools. <b>Planning.</b>"},
      {"kicker":"MAKE IT REAL · PORTFOLIO","headline":"Your agents are your *portfolio.*","lead":"A folder of small working agents, each with a before-and-after number, beats a marks sheet. It is proof you can do the work, before anyone has to hire you.","artifact":"your first three agents, saved with their numbers.","bubble":"Proof &gt; <b>promises.</b>"},
      {"kicker":"MAKE IT REAL · PLACEMENTS","headline":"Walk into the interview with a *demo.*","lead":"When they ask what you can do with AI, you do not answer, you open your laptop and show a working agent you built for a real task. That wins rooms.","bubble":"Show, don't <b>tell.</b>"},
      {"kicker":"MAKE IT REAL · EARN","headline":"This skill *pays,* sooner than you think.","lead":"Small businesses drown in repetitive work and cannot hire engineers. A student who can build a triage or screening agent for them is genuinely valuable. Freelance, intern, or start something.","bubble":"This skill <b>earns.</b>"},

const fmt = (s) => {
  const sign = s < 0 ? "-" : "";
  s = Math.abs(s);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${sign}${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
};

/* ----- Load sessions.json ----- */
async function loadSessions() {
  try {
    const res = await fetch("./sessions-college-foundation.json", { cache: "no-cache" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    WORKSHOP = data.workshop;
    SESSIONS = data.sessions;
    IDEAS = data.ideas || [];
    buildScreenSequence();
    renderCurrent();
  } catch (err) {
    $("#stage").innerHTML = `
      <div class="error">
        <h2>Could not load sessions-college-foundation.json</h2>
        <p>Make sure <code>sessions-college-foundation.json</code> sits next to <code>platform-college-foundation.html</code>.</p>
        <p style="margin-top:16px; font-size:14px;">If you opened this file directly with a double-click, your browser blocks local fetches. Run a local server with <code>python3 -m http.server</code> in the same folder, then open <code>http://localhost:8000/platform-college-foundation.html</code>.</p>
        <p style="margin-top:24px; opacity:0.5; font-size:12px;">${err.message}</p>
      </div>`;
  }
}

/* ----- Build the flat screen sequence ----- */
function buildScreenSequence() {
  SCREENS = [];

  // Welcome layer
  SCREENS.push({ type: "welcome" });
  SCREENS.push({ type: "founder-welcome" });
  SCREENS.push({ type: "housekeeping" });
  SCREENS.push({ type: "tools-landscape" });
  SCREENS.push({ type: "two-doors" });

  // Track phase transitions so we can insert interludes between them
  let prevPhase = null;
  let prevDay = null;

  SESSIONS.forEach((session, idx) => {
    const phase = session.phase;
    const day = String(session.day);

    // Day 2 morning welcome, first session of Day 2 of the weekend
    if (phase === "weekend" && day === "2" && prevDay !== "2") {
      SCREENS.push({ type: "day2-checkin" });
    }

    // Office-hours phase opener, appears once, before the first week of office hours
    if (phase === "office_hours" && prevPhase !== "office_hours") {
      SCREENS.push({ type: "phase-break", to: "office_hours" });
    }

    // Demo Day opener, appears once, before the Demo Day session
    if (phase === "demo_day" && prevPhase !== "demo_day") {
      SCREENS.push({ type: "phase-break", to: "demo_day" });
    }

    SCREENS.push({ type: "session-start", session });

    // Set-the-stage comes first: it introduces the section, then the concept slides teach it.
    SCREENS.push({ type: "stage", session });

    // Idea cards screen, appears once, inside Session 1 (Pick your idea), right after the
    // stage-setting, mirroring the school flow. Shows 8 ideas from the active set; the
    // founder picks one and personalises it in this same session.
    if (session.id === "7") {
      SCREENS.push({ type: "idea-cards" });
    }

    // Concept module (HMV teaching slides): the teaching slides for the stage, shown right
    // after the stage-setting so the intro leads into the lesson. `before_session` names
    // the first session of the stage.
    Object.keys(CONCEPT_MODULES).forEach((stageKey) => {
      const mod = CONCEPT_MODULES[stageKey];
      if (mod && mod.before_session === session.id) {
        mod.slides.forEach((slide, sIdx) => {
          SCREENS.push({
            type: "concept",
            session,
            slide: slide,
            stageNumber: mod.stage_number,
            stageName: mod.stage_name,
            conceptIndex: sIdx,
            conceptTotal: mod.slides.length
          });
        });
      }
    });

    // Office hours screen is dedicated and replaces the standard question/prompt/build/test flow
    if (session.session_type === "office_hours") {
      SCREENS.push({ type: "office-hours", session });
      // If this office-hours session defines a step-by-step procedure (like the chatbot),
      // walk its steps after the support screen, just like a build session. Otherwise give
      // each prompt its own screen (like Session 10 pitch deck).
      if (session.procedure && session.procedure.sections) {
        session.procedure.sections.forEach((section, secIdx) => {
          (section.steps || []).forEach((stp, stIdx) => {
            SCREENS.push({
              type: "step",
              session,
              section,
              step: stp,
              sectionIndex: secIdx,
              stepIndex: stIdx,
              code: section.id + String(stIdx + 1)
            });
          });
        });
      } else {
        const ohPrompts = session.prompts || [];
        ohPrompts.forEach((prompt, pIdx) => {
          SCREENS.push({
            type: "prompt",
            session,
            prompt,
            promptIndex: pIdx,
            promptTotal: ohPrompts.length
          });
        });
      }
      // Test output (the "homework leaves the room" check) still applies if present
      if (session.test_output && session.test_output.length) {
        SCREENS.push({ type: "test-output", session });
      }
      if (session.output_capture) {
        SCREENS.push({ type: "output-capture", session });
      }
      SCREENS.push({ type: "session-end", session });
      prevPhase = phase;
      prevDay = day;
      return;
    }

    // Step-by-step procedure (the build SOP): one screen per step, grouped into
    // sections. Replaces the standard question/hmv/prompt/build/test flow for any
    // session that defines a `procedure`. The full prompts live on the prompts page;
    // a step that uses one points the room there.
    if (session.procedure && session.procedure.sections) {
      session.procedure.sections.forEach((section, secIdx) => {
        (section.steps || []).forEach((stp, stIdx) => {
          SCREENS.push({
            type: "step",
            session,
            section,
            step: stp,
            sectionIndex: secIdx,
            stepIndex: stIdx,
            code: section.id + String(stIdx + 1)
          });
        });
      });
      if (session.output_capture) {
        SCREENS.push({ type: "output-capture", session });
      }
      SCREENS.push({ type: "session-end", session });
      prevPhase = phase;
      prevDay = day;
      return;
    }

    // Standard flow for all other session types (kickoff, build, milestone, interim_demo,
    // planning, demo_day, close)
    (session.questions || []).forEach((q, qIdx) => {
      SCREENS.push({
        type: "question",
        session,
        question: q,
        questionIndex: qIdx,
        questionTotal: session.questions.length,
      });
    });

    if (session.hmv && session.hmv.length) {
      SCREENS.push({ type: "hmv", session });
    }

    (session.prompts || []).forEach((p, pIdx) => {
      SCREENS.push({
        type: "prompt",
        session,
        prompt: p,
        promptIndex: pIdx,
        promptTotal: session.prompts.length,
      });
    });

    if (session.build && session.build.length) {
      SCREENS.push({ type: "build", session });
    }

    if (session.test_output && session.test_output.length) {
      SCREENS.push({ type: "test-output", session });
    }

    // Output capture happens after test-output, before session-end (for build sessions)
    if (session.output_capture) {
      SCREENS.push({ type: "output-capture", session });
    }

    SCREENS.push({ type: "session-end", session });

    // End-of-Day-1 interlude, fires after the last session of Day 1 in the weekend phase
    const nextSession = SESSIONS[idx + 1];
    const isLastOfDay1 = phase === "weekend" && day === "1"
      && (!nextSession || String(nextSession.day) !== "1" || nextSession.phase !== "weekend");
    if (isLastOfDay1) {
      SCREENS.push({ type: "day1-photo" });
    }

    // After Demo Day: SWISH retake (scoring tallied in parallel), then awards
    if (session.session_type === "demo_day") {
      SCREENS.push({ type: "swish-retake" });
      SCREENS.push({ type: "awards" });
    }

    if (session.break_after) {
      SCREENS.push({
        type: "break",
        afterSession: session,
        nextSession: SESSIONS[idx + 1] || null,
      });
    }

    prevPhase = phase;
    prevDay = day;
  });

  // What you built first, then the final inspirational slide (closing is the last screen)
  SCREENS.push({ type: "workshop-complete" });
  SCREENS.push({ type: "closing" });
}

/* ----- Navigation ----- */
function next() {
  if (currentScreenIdx < SCREENS.length - 1) {
    currentScreenIdx++;
    renderCurrent();
  }
}
function prev() {
  if (currentScreenIdx > 0) {
    currentScreenIdx--;
    renderCurrent();
  }
}

/* ----- Render current screen ----- */
function renderCurrent() {
  const screen = SCREENS[currentScreenIdx];
  const stage = $("#stage");
  const topbar = $("#topbar");
  const bottombar = $("#bottombar");

  // Stop break timer if leaving break
  if (screen.type !== "break" && breakTimer.intervalId) {
    clearInterval(breakTimer.intervalId);
    breakTimer.intervalId = null;
  }

  // Top/bottom bars hidden on welcome-layer screens, break, complete, and interlude moments
  const isWelcomeLayer = screen.type === "welcome" || screen.type === "founder-welcome" || screen.type === "housekeeping"
                       || screen.type === "two-doors" || screen.type === "journey-map"
                       || screen.type === "tools-landscape";
  const isInterlude = screen.type === "day1-photo"
                    || screen.type === "day2-checkin"
                    || screen.type === "phase-break"
                    || screen.type === "portfolio-reveal" || screen.type === "swish-retake" || screen.type === "awards" || screen.type === "closing";
  const noChrome = isWelcomeLayer || isInterlude || screen.type === "workshop-complete" || screen.type === "break";
  topbar.classList.toggle("hidden", noChrome);
  bottombar.classList.toggle("hidden", screen.type === "welcome");
  renderBuildbar(screen);

  // Concept caterpillar buddy, shown only on concept slides
  const cat = document.getElementById("concept-cat");
  if (cat) {
    if (screen.type === "concept") {
      const sl = screen.slide || {};
      document.getElementById("concept-cat-prop").innerHTML = "";
      const bub = document.getElementById("concept-cat-bubble");
      if (sl.bubble) { bub.innerHTML = sl.bubble; bub.style.display = ""; } else { bub.style.display = "none"; }
      const cimg = document.getElementById("concept-cat-img");
      if (cimg) cimg.src = (sl.mascot === "butterfly") ? "butterfly.png" : "funny-caterpillar.png";
      cat.style.display = (sl.qr || sl.qrs || sl.nbgrid) ? "none" : "block";
    } else {
      cat.style.display = "none";
    }
  }

  // Update topbar context
  if (screen.session) {
    $("#topbar-eyebrow").textContent = topbarEyebrow(screen.session);
    $("#topbar-title").textContent = screen.session.title;
    $("#topbar-section").textContent = "";  // section counter removed (redundant, crowded the title)
    updateProgress();
  } else if (screen.type === "idea-cards") {
    const defaultPage = (WORKSHOP && WORKSHOP.cohort_idea_page) || 1;
    const activePage = Number(window.__ideaSetActive || defaultPage);
    $("#topbar-eyebrow").textContent = "IDEATE";
    $("#topbar-title").textContent = "Build your own agent";
    $("#topbar-section").textContent = `${(IDEAS||[]).length} enterprise AI agents`;
    updateProgress();
  }

  // Reset/start timer for sessions. Also re-sync when we land in a different
  // session without passing its session-start (e.g. via the Jump nav).
  if (screen.session && (screen.type === "session-start" || screen.session.id !== timer.sessionId)) {
    setupTimer(screen.session);
  } else if (isWelcomeLayer || isInterlude || screen.type === "workshop-complete") {
    stopTimer();
  }

  // Render content
  let html = "";
  switch (screen.type) {
    case "welcome":            html = renderWelcome(); break;
    case "founder-welcome":    html = renderFounderWelcome(); break;
    case "housekeeping":       html = renderHousekeeping(); break;
    case "two-doors":          html = renderTwoDoors(); break;
    case "journey-map":        html = renderJourneyMap(); break;
    case "tools-landscape":    html = renderToolsLandscape(); break;
    case "idea-cards":         html = renderIdeaCards(); break;
    case "concept":            html = renderConcept(screen); break;
    case "day1-photo":         html = renderDay1Photo(); break;
    case "day2-checkin":       html = renderDay2Checkin(); break;
    case "phase-break":        html = renderPhaseBreak(screen); break;
    case "portfolio-reveal":   html = renderPortfolioReveal(); break;
    case "swish-retake":       html = renderSwishRetake(); break;
    case "awards":             html = renderAwards(); break;
    case "closing":            html = renderClosing(); break;
    case "session-start":      html = renderSessionStart(screen.session); break;
    case "stage":              html = renderStage(screen.session); break;
    case "step":               html = renderStep(screen); break;
    case "question":           html = renderQuestion(screen); break;
    case "hmv":                html = renderHMV(screen.session); break;
    case "prompt":             html = renderPrompt(screen); break;
    case "build":              html = renderBuild(screen.session); break;
    case "test-output":        html = renderTestOutput(screen.session); break;
    case "office-hours":       html = renderOfficeHours(screen.session); break;
    case "output-capture":     html = renderOutputCapture(screen.session); break;
    case "session-end":        html = renderSessionEnd(screen); break;
    case "break":              html = renderBreak(screen); break;
    case "workshop-complete":  html = renderWorkshopComplete(); break;
  }
  stage.innerHTML = `<div class="screen">${html}</div>`;

  // Lock viewport for screens that need the bottom strip always visible
  stage.classList.toggle("fit-viewport", screen.type === "prompt" || screen.type === "idea-cards" || screen.type === "step" || screen.type === "awards" || screen.type === "concept" || screen.type === "build");

  // Wire up dynamic handlers per screen
  attachHandlers(screen);

  // Refresh the jump-to-session menu state
  refreshJumpMenu();

  // Prev/next state
  $("#prev-btn").disabled = currentScreenIdx === 0;
  $("#next-btn").disabled = currentScreenIdx >= SCREENS.length - 1;
}

function topbarEyebrow(session) {
  // Show stage as the primary label when available; the session number/role appears in the subtitle/title.
  // For the Kickoff session, the stage is just "Kickoff" itself (not a venture stage).
  if (session.stage) {
    return session.stage.toUpperCase();
  }
  // Fallback for sessions without stage (should not happen in v3)
  if (session.session_type === "office_hours") return `${session.day} · Office Hours`;
  if (session.session_type === "demo_day") return "Demo Day";
  if (session.session_type === "close") return "Close";
  if (session.session_type === "kickoff") return "Kickoff";
  if (session.session_type === "milestone") return "Milestone";
  if (session.session_type === "interim_demo") return "Interim Demo Day";
  if (session.session_type === "planning") return "Planning";
  return `Session ${session.number}`;
}

function sectionLabel(screen) {
  switch (screen.type) {
    case "session-start":  return "Begin";
    case "stage":          return "Set the Stage";
    case "step":           return screen.section ? screen.section.name : "Build";
    case "question":       return `Question ${screen.questionIndex + 1} of ${screen.questionTotal}`;
    case "hmv":            return "HMV Techniques";
    case "prompt":         return screen.promptTotal > 1
                            ? `Prompt ${screen.promptIndex + 1} of ${screen.promptTotal}`
                            : "The Prompt";
    case "build":          return "Build";
    case "test-output":    return "Test Output";
    case "office-hours":   return "Office Hours";
    case "output-capture": return "Save your work";
    case "session-end":    return "Complete";
    case "concept":        return `Concept ${screen.conceptIndex + 1} of ${screen.conceptTotal}`;
    default:               return "";
  }
}

function buildbarState(screen) {
  const t = screen.type;
  if (t==="welcome"||t==="founder-welcome"||t==="housekeeping"||t==="two-doors"||t==="journey-map"||t==="tools-landscape") return null;
  if (screen.session) {
    const n = Number(screen.session.number);
    if (n >= 1 && n <= 7) return { done: n-1, current: n-1 };
    return { done: 7, current: -1 };
  }
  if (t === "idea-cards") return { done: 0, current: 0 };
  if (t === "break") {
    const nn = screen.nextSession ? Number(screen.nextSession.number) : 0;
    if (nn >= 1 && nn <= 7) return { done: nn-1, current: -1 };
    return { done: 7, current: -1 };
  }
  if (t === "day1-photo" || t === "day2-checkin") return { done: 4, current: -1 };
  return { done: 7, current: -1 };
}

function renderBuildbar(screen) {
  const bar = document.getElementById("buildbar");
  if (!bar) return;
  const st = buildbarState(screen);
  if (!st) { bar.classList.add("hidden"); return; }
  const stages = (WORKSHOP && WORKSHOP.steps) ? WORKSHOP.steps : ((WORKSHOP && WORKSHOP.stages) ? WORKSHOP.stages : []);
  const curStage = screen.session ? (screen.session.nav || screen.session.stage) : null;
  const curIdx = stages.indexOf(curStage);
  let html = '<span class="bb-title">BUILD PROGRESS</span><div class="bb-track">';
  stages.forEach(function (name, idx) {
    let cls = "bb-item bb-clickable";
    if (curIdx > -1 && idx < curIdx) cls += " done";
    else if (idx === curIdx) cls += " current";
    const mark = (curIdx > -1 && idx < curIdx) ? "\u2713" : "";
    if (idx > 0) html += '<span class="bb-sep"></span>';
    html += '<span class="' + cls + '" data-stage="' + name.replace(/"/g, "") + '"><span class="bb-dot">' + mark + '</span>' + name + '</span>';
  });
  html += '</div>';
  bar.innerHTML = html;
  bar.classList.remove("hidden");
  bar.querySelectorAll(".bb-item[data-stage]").forEach(function (elm) {
    elm.onclick = function () {
      const stg = elm.getAttribute("data-stage");
      const targetIdx = SCREENS.findIndex(function (s) { return s.session && (s.session.nav || s.session.stage) === stg; });
      if (targetIdx > -1) jumpToScreen(targetIdx);
    };
  });
}
function updateProgress() {
  const screen = SCREENS[currentScreenIdx];
  if (!screen.session) return;
  const sessionId = screen.session.id;
  const sessionScreens = SCREENS.filter(s => s.session && s.session.id === sessionId);
  const indices = SCREENS
    .map((s, i) => (s.session && s.session.id === sessionId) ? i : -1)
    .filter(i => i !== -1);
  const localIdx = indices.indexOf(currentScreenIdx);
  const total = sessionScreens.length;

  const pct = total <= 1 ? 100 : Math.round((localIdx / (total - 1)) * 100);
  $("#progress").innerHTML = `<div class="progress-fill" style="width:${pct}%"></div>`;
}

function renderConcept(screen) {
  const sl = screen.slide || {};
  if (sl.lens === "opener") {
    const chips = (sl.chips || []).map(function(c){
      return '<div class="concept-t"><span class="concept-td" style="background:var(--accent)"></span> ' + conceptEm(c) + '</div>';
    }).join("");
    return `
      <div class="concept-slide concept-opener">
        <div class="concept-stage-num">${screen.stageNumber ? `STAGE ${escapeHtml(screen.stageNumber)} &middot; ` : ""}${escapeHtml((screen.stageName || "").toUpperCase())}</div>
        <h1 class="concept-opener-title">${conceptEm(sl.headline)}</h1>
        <div class="concept-opener-sub">${conceptEm(sl.sub || "")}</div>
        ${chips ? `<div class="concept-three">${chips}</div>` : ""}
      </div>`;
  }
  let body = "";
  if (sl.lead) body += `<p class="concept-lead">${conceptEm(sl.lead)}</p>`;
  const _w = sl.wrong || sl.bad, _g = sl.right || sl.good;
  (sl.paras || []).forEach(function(p){ body += `<p>${conceptEm(p)}</p>`; });
  if (sl.rows) {
    body += '<div class="concept-errs">' + sl.rows.map(function(r){
      return '<div class="concept-err"><span class="concept-err-code">' + escapeHtml(r.code) + '</span><div class="concept-err-txt"><div class="concept-err-m">' + conceptEm(r.means) + '</div><div class="concept-err-a">' + conceptEm(r.act) + '</div></div></div>';
    }).join('') + '</div>';
  }
  if (sl.steps) {
    body += '<ol class="concept-steps">' + sl.steps.map(function(s){
      var t = (typeof s === 'string') ? s : (s.title || '');
      var d = (typeof s === 'object' && s.detail) ? '<span class="concept-step-d">' + conceptEm(s.detail) + '</span>' : '';
      return '<li class="concept-step"><span class="concept-step-t">' + conceptEm(t) + '</span>' + d + '</li>';
    }).join('') + '</ol>';
  }
  if (_w || _g) {
    body += `<div class="concept-ba">`;
    if (_w) body += `<div class="concept-ba-card concept-bad"><div class="concept-ba-label">The wrong way</div><p>${_w}</p></div>`;
    if (_g) body += `<div class="concept-ba-card concept-good"><div class="concept-ba-label">The right way</div><p>${_g}</p></div>`;
    body += `</div>`;
  }
  if (sl.note && sl.note.text) {
    body += '<div class="concept-note"><span class="concept-note-label">' + escapeHtml(sl.note.label || 'Note') + '</span><span class="concept-note-text">' + conceptEm(sl.note.text) + '</span></div>';
  }
  if (sl.qrs) {
    body += '<div class="concept-qrs">' + sl.qrs.map(function(q){
      return '<div class="concept-qr-card"><div class="concept-qr-box">' + q.svg + '</div><div class="concept-qr-label">' + conceptEm(q.label) + '</div><div class="concept-qr-url">' + escapeHtml(q.url) + '</div></div>';
    }).join('') + '</div>';
  }
  if (sl.nbgrid) {
    body += '<div class="concept-nbgrid">' + sl.nbgrid.map(function(q){
      return '<div class="concept-nb-card"><div class="concept-nb-box">' + q.svg + '</div><div class="concept-nb-text"><div class="concept-nb-name">' + conceptEm(q.label) + '</div><div class="concept-nb-url">' + escapeHtml(q.url) + '</div></div></div>';
    }).join('') + '</div>';
  }
  if (sl.palette) {
    body += '<div class="concept-palette">' + sl.palette.cards.map(function(c){
      return '<div class="palette-card"><div class="palette-card-head"><span class="palette-card-title">' + conceptEm(c.title) + '</span><span class="palette-card-tag">' + escapeHtml(c.tag) + '</span></div><div class="palette-card-desc">' + escapeHtml(c.desc) + '</div></div>';
    }).join('') + '</div>';
  }
  if (sl.diagram) body = '<div class="concept-diagram">' + renderDiagram(sl.diagram) + '</div>' + body;
  const kicker = sl.kicker || sl.practice || "";
  const caseletCls = sl.caselet ? " concept-caselet" : "";
  const wideCls = sl.palette ? " concept-slide-wide" : "";
  const caseletBadge = sl.caselet ? `<span class="caselet-badge">${escapeHtml(typeof sl.caselet === "string" ? sl.caselet : "Caselet")}</span>` : "";
  return `
    <div class="concept-slide${caseletCls}${wideCls}">
      ${kicker ? `<div class="concept-lens-tag">${caseletBadge}<span class="concept-lens-dot" style="background:var(--accent)"></span><span class="concept-lens-name">${escapeHtml(kicker)}</span></div>` : caseletBadge}

function parseStepTool(t) {
  if (!t) return null;
  const m = String(t).match(/^(.*?)\s*\(([^)]+)\)\s*$/);
  if (m) {
    const domain = m[2].trim().replace(/^https?:\/\//, "").replace(/\/+$/, "");
    return { name: m[1].trim(), url: "https://" + domain };
  }
  return { name: String(t).trim(), url: null };
}

function renderStep(screen) {
  const st = screen.step || {};
  const section = screen.section || {};
  const code = screen.code || "";
  const tool = st.tool ? parseStepTool(st.tool) : null;
  const detail = (st.detail || []).map((line, i) =>
    `<li><span class="step-detail-num">${i + 1}</span><span>${escapeHtml(line)}</span></li>`
  ).join("");

  let promptCallout = "";
  if (st.prompt_ref) {
    const p = (screen.session.prompts || []).find(x => x.number === st.prompt_ref);
    const ptitle = p ? p.title : ("Prompt " + st.prompt_ref);
    promptCallout = `
      <div class="step-prompt">
        <span class="step-prompt-tag">Prompt ${st.prompt_ref}</span>
        <div class="step-prompt-body">
          <div class="step-prompt-title">${escapeHtml(ptitle)}</div>
          <div class="step-prompt-where">Copy it on your laptop &middot; justbuild.orangecaterpillar.com/prompts-college</div>
        </div>
      </div>`;
  }

  const toolLine = tool
    ? `<div class="step-tool">${tool.url
        ? `<a href="${escapeHtml(tool.url)}" target="_blank" rel="noopener">${escapeHtml(tool.name)} &#8599;</a>`
        : escapeHtml(tool.name)}</div>`
    : "";

  return `
    <div class="step-screen">
      <div class="step-head">
        <span class="step-code">${escapeHtml(code)}</span>
        <span class="step-section-name">${escapeHtml(section.name || "")}</span>
      </div>
      <h2 class="step-title">${escapeHtml(st.title || "")}</h2>
      ${st.body ? `<p class="step-lead">${escapeHtml(st.body)}</p>` : ""}
      ${toolLine}
      ${detail ? `<ol class="step-detail">${detail}</ol>` : ""}
      ${promptCallout}
    </div>
  `;
}

function attachHandlers(screen) {
  // Welcome
  const startBtn = $("#start-btn");

  });

  // Session start
  const beginBtn = $("#begin-btn");
  if (beginBtn) beginBtn.onclick = () => {
    startTimer();
    next();
  };

  // Continue from session-end
  const continueBtn = $("#continue-btn");
  if (continueBtn) continueBtn.onclick = next;

  // Copy prompt
  const copyBtn = $("#copy-btn");
  if (copyBtn) copyBtn.onclick = async () => {
    const text = decodeURIComponent(copyBtn.dataset.prompt);
    try {
      await navigator.clipboard.writeText(text);
      copyBtn.textContent = "Copied ✓";
      copyBtn.classList.add("copied");
      setTimeout(() => {
        copyBtn.textContent = "Copy Prompt";
        copyBtn.classList.remove("copied");
      }, 2000);
    } catch (err) {
      // Fallback: select the prompt box
      const sel = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents($("#prompt-box"));
      sel.removeAllRanges();
      sel.addRange(range);
      copyBtn.textContent = "Selected. Press Cmd/Ctrl+C";
      setTimeout(() => { copyBtn.textContent = "Copy Prompt"; }, 3000);
    }
  };

  // Test output checkboxes
  document.querySelectorAll(".test-item").forEach(el => {
    el.onclick = () => {
      const idx = parseInt(el.dataset.idx, 10);
      const sid = el.dataset.session; // session ids may be non-numeric strings ("milestone", "interim-demo")
      testsChecked[sid][idx] = !testsChecked[sid][idx];

/* ============================================
   TIMER
   ============================================ */

function setupTimer(session) {
  stopTimer();
  timer.totalSeconds = session.duration_minutes * 60;
  timer.remainingSeconds = timer.totalSeconds;
  timer.sessionId = session.id;
  timer.running = false;
  timer.paused = false;
  updateTimerDisplay();
}

function startTimer() {
  if (timer.running) return;
  timer.running = true;
  timer.paused = false;
  timer.intervalId = setInterval(tickTimer, 1000);
  updateTimerDisplay();
}

function pauseTimer() {
  if (!timer.running) return;
  timer.paused = !timer.paused;
  updateTimerDisplay();
}

function stopTimer() {
  if (timer.intervalId) clearInterval(timer.intervalId);
  timer.intervalId = null;
  timer.running = false;
  timer.paused = false;
  $("#timer").textContent = "--:--";
  $("#timer").className = "timer";
}

function tickTimer() {
  if (timer.paused) return;
  timer.remainingSeconds--;
  updateTimerDisplay();
}

function updateTimerDisplay() {
  const el = $("#timer");
  if (!timer.running && !timer.totalSeconds) {
    el.textContent = "--:--";
    el.className = "timer";
    return;
  }
  el.textContent = fmt(timer.remainingSeconds);
  el.className = "timer";
  if (timer.paused) el.classList.add("paused");
  if (timer.remainingSeconds <= 0) el.classList.add("expired");
  else if (timer.remainingSeconds <= 5 * 60) el.classList.add("danger");
  else if (timer.remainingSeconds <= 10 * 60) el.classList.add("warning");
}

/* ----- Break timer ----- */
function startBreakTimer() {
  if (breakTimer.intervalId) clearInterval(breakTimer.intervalId);
  breakTimer.intervalId = setInterval(() => {
    breakTimer.remainingSeconds--;
    const display = $("#break-display");
    if (display) {
      const m = Math.floor(breakTimer.remainingSeconds / 60);
      const s = breakTimer.remainingSeconds % 60;
      display.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }
    if (breakTimer.remainingSeconds <= 0) {
      clearInterval(breakTimer.intervalId);
      breakTimer.intervalId = null;
      breakTimer.finished = true;
      playChime();
      renderCurrent();
    }
  }, 1000);
}

function playChime() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    const playTone = (freq, start, dur) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = freq;
      osc.type = "sine";
      osc.connect(gain);
      gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0, ctx.currentTime + start);
      gain.gain.linearRampToValueAtTime(0.18, ctx.currentTime + start + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + dur);
    };
    playTone(880, 0, 0.6);    // A5
    playTone(1318, 0.18, 0.7); // E6
    setTimeout(() => ctx.close(), 1500);
  } catch (e) { /* silent */ }
}

function refreshJumpMenu() {
  const menu = $("#jump-menu");
  const btnLabel = $("#jump-btn-label");
  if (!menu) return;

  // Friendly label for a single screen (one section)
  const typeLabel = (scr) => {
    switch (scr.type) {
      case "welcome": return "Welcome";
      case "housekeeping": return "Housekeeping";
      case "two-doors": return "Two doors";
      case "journey-map": return "Journey map";
      case "tools-landscape": return "Tools landscape";
      case "concept":
        return scr.slide && scr.slide.lens === "opener"
          ? "Overview"
          : (scr.slide ? (scr.slide.kicker || scr.slide.practice || "Concept") : "Concept");
      case "session-start": return "Begin";
      case "stage": return "Set the stage";
      case "step": return `${scr.code || ""} ${scr.step ? scr.step.title : ""}`.trim();
      case "idea-cards": return "Idea cards";
      case "question": return "Question";
      case "hmv": return "HMV check";
      case "prompt": return scr.promptTotal > 1 ? `Prompt ${(scr.promptIndex || 0) + 1}` : "Prompt";
      case "build": return "Build";
      case "test-output": return "Test the output";
      case "office-hours": return "Office hours";
      case "output-capture": return "Save the work";
      case "session-end": return "Wrap up";
      case "phase-break": return "Transition";
      case "break": return "Break";
      case "portfolio-reveal": return "Portfolio reveal";
      case "swish-retake": return "SWISH retake";
      case "awards": return "Awards";
      case "closing": return "Closing";
      case "workshop-complete": return "Complete";
      default: return scr.type.replace(/-/g, " ").replace(/^./, c => c.toUpperCase());
    }
  };

  // Group every screen, in flow order, so the facilitator can jump to any section
  const intro = ["welcome", "housekeeping", "two-doors", "journey-map", "tools-landscape"];
  const groupsOrder = [];
  const groups = {};
  let lastSessionGroup = null;

  SCREENS.forEach((scr, i) => {
    let g;
    if (intro.includes(scr.type)) {
      g = "Intro";
    } else if (scr.session) {
      const num = scr.session.number || scr.session.id;
      g = `${num}. ${scr.session.title}`;
      lastSessionGroup = g;
    } else if (scr.type === "idea-cards") {
      g = lastSessionGroup || "Pick your idea";
    } else if (scr.type === "phase-break" || scr.type === "break") {
      g = "Transitions";
    } else if (scr.type === "portfolio-reveal" || scr.type === "closing" || scr.type === "workshop-complete") {
      g = "Wrap up";
    } else {
      g = lastSessionGroup || "More";
    }
    if (!groups[g]) { groups[g] = []; groupsOrder.push(g); }
    groups[g].push({ scr, i });
  });

  let html = "";
  groupsOrder.forEach(g => {
    html += `<div class="jump-group"><div class="jump-group-label">${escapeHtml(g)}</div>`;
    groups[g].forEach(({ scr, i }) => {
      const isCurrent = i === currentScreenIdx;
      html += `<div class="jump-item ${isCurrent ? "current" : ""}" data-idx="${i}">
        <span class="jump-item-num">${String(i + 1).padStart(2, "0")}</span>
        <span class="jump-item-title">${escapeHtml(typeLabel(scr))}</span>
      </div>`;
    });
    html += `</div>`;
  });
  menu.innerHTML = html;

  // Button label: current stage (concept or session), else Jump
  if (btnLabel) {
    const cur = SCREENS[currentScreenIdx];
    let lbl = "Jump";
    if (cur) {
      if (cur.type === "concept") lbl = cur.stageName || "Jump";
      else if (cur.session) lbl = cur.session.stage || cur.session.number || "Jump";
    }
    btnLabel.textContent = lbl;
  }

  // Click handlers: jump straight to that screen index
  menu.querySelectorAll(".jump-item").forEach(el => {
    el.onclick = () => jumpToScreen(parseInt(el.dataset.idx, 10));
  });
}

function jumpToScreen(idx) {
  if (idx >= 0 && idx < SCREENS.length) {
    currentScreenIdx = idx;
    renderCurrent();
  }
  closeJumpMenu();
}

function toggleJumpMenu() {
  const wrap = $("#jump-wrap");
  if (!wrap) return;
  const willOpen = !wrap.classList.contains("open");
  wrap.classList.toggle("open");
  if (willOpen) {
    const cur = wrap.querySelector(".jump-item.current");
    if (cur) cur.scrollIntoView({ block: "center" });
  }
}

function closeJumpMenu() {
  const wrap = $("#jump-wrap");
  if (wrap) wrap.classList.remove("open");
}

document.addEventListener("DOMContentLoaded", () => {
  const btn = document.getElementById("jump-btn");
  if (btn) btn.addEventListener("click", (e) => { e.stopPropagation(); toggleJumpMenu(); });
  // Click outside closes
  document.addEventListener("click", (e) => {
    const wrap = document.getElementById("jump-wrap");
    if (wrap && !wrap.contains(e.target)) closeJumpMenu();
  });
});

document.addEventListener("keydown", (e) => {
  // Don't intercept when typing in inputs
  if (e.target.matches("input, textarea, [contenteditable]")) return;

  switch (e.key) {
    case "ArrowRight":
    case " ":
      e.preventDefault();
      next();
      break;
    case "ArrowLeft":
      e.preventDefault();
      prev();
      break;
    case "t": case "T":
      e.preventDefault();
      pauseTimer();
      break;
    case "f": case "F":
      e.preventDefault();
      toggleFullscreen();
      break;
    case "h": case "H":
      e.preventDefault();
      toggleHMV();
      break;
    case "j": case "J":
      e.preventDefault();
      toggleJumpMenu();
      break;
  }
});

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.();

function toggleHMV() {

function escapeHtml(str) {
  if (!str) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
function escapeAttr(str) { return escapeHtml(str); }

/* ============================================
   AUTH GATE
   ============================================ */
/*
  Hardcoded credentials are stored as SHA-256 hashes below.
  This is a soft gate. The JS file is publicly readable, so a
  determined visitor can still extract the hashes and brute-force.
  For real security, move to Render-level Basic Auth.

  TO SET CREDENTIALS:
  1. Open a browser console anywhere and run:
       crypto.subtle.digest("SHA-256", new TextEncoder().encode("YOUR_VALUE"))
         .then(b => console.log(Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,"0")).join("")));
  2. Paste the resulting hex string into AUTH_ID_HASH or AUTH_PW_HASH.

  Defaults below are for "admin" / "change-me". REPLACE BEFORE DEPLOY.
*/
const AUTH_ID_HASH = "9f32a6796682f1c784d46ca60d38aab39a4862523b4043814c2793c7b9382520";
const AUTH_PW_HASH = "f181008ea04c7c3d9734a4b9d87e48df67970972a43641bb0608b0e1e91c6c1b";
const AUTH_SESSION_KEY = "jb-platform-auth";

async function sha256Hex(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

function dismissLogin() {
  $("#login-overlay").classList.add("hidden");
  loadSessions();
}

async function tryLogin(id, pw) {
  // ID is case-insensitive (matches school and women platforms); password stays case-sensitive
  const normalizedId = (id || "").trim().toLowerCase();
  const [idHash, pwHash] = await Promise.all([sha256Hex(normalizedId), sha256Hex(pw)]);
  return idHash === AUTH_ID_HASH && pwHash === AUTH_PW_HASH;
}

function initAuth() {
  // Already authenticated this session?
  try {
    if (sessionStorage.getItem(AUTH_SESSION_KEY) === "1") {
      dismissLogin();
      return;
    }
  } catch (_) { /* sessionStorage may be unavailable; fall through to form */ }

  const form = $("#login-form");
  const errEl = $("#login-error");
  const card = $("#login-card");
  const submit = $("#login-submit");
  const idInput = $("#login-id");
  const pwInput = $("#login-pw");

  // Focus the ID field on load
  setTimeout(() => idInput.focus(), 50);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = idInput.value.trim();
    const pw = pwInput.value;
    if (!id || !pw) return;

    submit.disabled = true;
    errEl.classList.remove("show");

    const ok = await tryLogin(id, pw);
    submit.disabled = false;

    if (ok) {
      try { sessionStorage.setItem(AUTH_SESSION_KEY, "1"); } catch (_) {}
      dismissLogin();
    } else {
      errEl.classList.add("show");
      card.classList.remove("shake");
      // Force reflow so the animation re-triggers
      void card.offsetWidth;
      card.classList.add("shake");
      pwInput.value = "";
      pwInput.focus();
    }
  });
}

initAuth();
