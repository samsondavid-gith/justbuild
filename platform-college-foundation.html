<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Just Build  /  Facilitator Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Inter:ital,wght@0,300..700;1,300..700&family=JetBrains+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
  /* ========================================
     Just Build  /  Facilitator Platform
     Dark mode. Optimised for projection.
     ======================================== */

  :root {
    --bg:            #0A0A0A;
    --bg-elev-1:    #141414;
    --bg-elev-2:    #1C1C1C;
    --line:          rgba(255,255,255,0.08);
    --line-strong:   rgba(255,255,255,0.16);
    --text:          #FFFFFF;
    --text-soft:     #C8C8C8;
    --text-muted:    #8A8A8A;
    --text-faint:    #5A5A5A;
    --accent:        #C17D2A;
    --accent-soft:   rgba(193, 125, 42, 0.18);
    --accent-glow:   rgba(193, 125, 42, 0.35);
    --warning:       #E8B53A;
    --danger:        #D7553A;
    --serif:         'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    --sans:          'Inter', system-ui, -apple-system, sans-serif;
    --mono:          'JetBrains Mono', 'SF Mono', Menlo, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 18px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ----- Top bar ----- */
  .topbar {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: 32px;
    padding: 10px 40px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    z-index: 5;
  }
  .topbar.hidden { display: none; }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: nowrap;
    min-width: 0;
    overflow: hidden;
  }
  .topbar-logo {
    width: 30px;
    height: 30px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .topbar-eyebrow {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .topbar-title {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 400;
    letter-spacing: -0.01em;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .topbar-section {
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 38ch;
    min-width: 0;
    flex: 0 1 auto;
  }

  .topbar-center {
    display: flex;
    justify-content: center;
  }

  .timer {
    font-family: var(--mono);
    font-size: 28px;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--text);
    padding: 6px 18px;
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    cursor: pointer;
    user-select: none;
    transition: all 0.2s ease;
    min-width: 130px;
    text-align: center;
  }
  .timer:hover { border-color: var(--accent); }
  .timer.paused { color: var(--text-muted); border-style: dashed; }
  .timer.warning { color: var(--warning); border-color: rgba(232, 181, 58, 0.4); }
  .timer.danger { color: var(--danger); border-color: rgba(215, 85, 58, 0.5); }
  .timer.expired { animation: pulse 2s ease-in-out infinite; color: var(--danger); }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  .topbar-right {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 12px;
    color: var(--text-muted);
    font-size: 12px;
    letter-spacing: 0.04em;
    min-width: 0;
  }
  .progress {
    flex: 0 1 auto;
    width: clamp(80px, 11vw, 160px);
    min-width: 44px;
    height: 4px;
    border-radius: 2px;
    background: var(--line-strong);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s ease;
  }

  /* ----- Jump-to-session picker ----- */
  .jump-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
  }
  .jump-btn {
    appearance: none;
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px 12px;
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all 0.18s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .jump-btn:hover { color: var(--text); border-color: var(--line-strong); }
  .jump-btn svg { opacity: 0.6; transition: transform 0.2s ease; }
  .jump-wrap.open .jump-btn svg { transform: rotate(180deg); }

  .jump-menu {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    min-width: 380px;
    max-height: 70vh;
    overflow-y: auto;
    background: var(--bg-elev-1);
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    padding: 8px;
    box-shadow: 0 18px 48px -12px rgba(0, 0, 0, 0.6);
    display: none;
    z-index: 50;
  }
  .jump-wrap.open .jump-menu { display: block; }
  .jump-group {
    padding: 12px 12px 6px;
  }
  .jump-group-label {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 8px;
  }
  .jump-item {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 9px 12px;
    border-radius: 4px;
    cursor: pointer;
    color: var(--text-soft);
    font-size: 14px;
    line-height: 1.4;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .jump-item:hover { background: var(--bg-elev-2); color: var(--text); }
  .jump-item.current { background: rgba(193, 125, 42, 0.12); color: var(--text); }
  .jump-item-num {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    min-width: 36px;
    letter-spacing: 0.04em;
  }
  .jump-item.current .jump-item-num { color: var(--accent); }
  .jump-item-title {
    flex: 1;
  }
  .jump-item-time {
    font-size: 11px;
    color: var(--text-faint);
    font-family: var(--mono);
  }

  /* ----- Office Hours screen ----- */
  .oh-screen {
    max-width: 900px;
    margin: 0 auto;
  }
  .oh-section {
    margin-top: 40px;
  }
  .oh-section-label {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 16px;
  }
  .oh-agenda {
    list-style: none;
    counter-reset: agenda;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .oh-agenda li {
    counter-increment: agenda;
    display: flex;
    gap: 18px;
    align-items: flex-start;
    color: var(--text-soft);
    font-size: 18px;
    line-height: 1.5;
    padding-left: 0;
  }
  .oh-agenda li::before {
    content: counter(agenda, decimal-leading-zero);
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    min-width: 36px;
    padding-top: 4px;
    letter-spacing: 0.04em;
  }
  .oh-stuck-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .oh-stuck {
    padding: 20px 24px;
    background: var(--bg-elev-1);
    border-left: 2px solid var(--accent);
    border-radius: 0 4px 4px 0;
  }
  .oh-stuck-title {
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 500;
    margin-bottom: 8px;
    color: var(--text);
  }
  .oh-stuck-resolution {
    color: var(--text-soft);
    font-size: 16px;
    line-height: 1.55;
  }
  .oh-prompts {
    list-style: none;
    counter-reset: oh-prompt;
    padding: 0;
    margin: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .oh-prompt-item {
    counter-increment: oh-prompt;
    padding: 16px 18px 16px 48px;
    background: rgba(193,125,42,0.06);
    border: 1px solid var(--accent-soft);
    border-radius: 4px;
    position: relative;
  }
  .oh-prompt-item::before {
    content: counter(oh-prompt, decimal-leading-zero);
    position: absolute;
    left: 14px;
    top: 14px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    color: var(--accent);
    font-weight: 500;
  }
  .oh-prompt-title {
    font-family: var(--serif);
    font-size: 16px;
    color: var(--text);
    line-height: 1.4;
  }
  .oh-prompt-note {
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
  }
  .oh-prompt-note strong {
    font-family: var(--mono);
    color: var(--accent);
    font-weight: 500;
  }
  @media (max-width: 800px) {
    .oh-prompts { grid-template-columns: 1fr; }
  }
  .oh-qa, .oh-homework {
    padding: 22px 26px;
    background: var(--bg-elev-1);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--text-soft);
    font-size: 17px;
    line-height: 1.55;
  }

  /* ----- Milestone screen indicator ----- */
  .milestone-banner {
    background: rgba(193, 125, 42, 0.08);
    border: 1px solid rgba(193, 125, 42, 0.25);
    padding: 14px 22px;
    border-radius: 4px;
    color: var(--accent);
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 32px;
    text-align: center;
    font-weight: 500;
  }

  /* ----- Workshop-complete portfolio-contents panel ----- */
  .wc-contents {
    margin: 32px auto 40px;
    padding: 24px 28px;
    background: var(--bg-elev-1);
    border: 1px solid var(--line);
    border-radius: 6px;
    max-width: 920px;
  }
  .wc-contents-label {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 16px;
  }
  .wc-contents-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px 24px;
  }
  .wc-contents-list li {
    color: var(--text-soft);
    font-size: 15px;
    line-height: 1.4;
  }
  .wc-contents-list li strong {
    display: inline-block;
    min-width: 28px;
    color: var(--accent);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.04em;
  }
  @media (max-width: 880px) {
    .wc-contents-list { grid-template-columns: repeat(2, 1fr); }
  }

  /* ----- Stage / main area ----- */
  .stage {
    flex: 1 1 auto;
    display: flex;
    padding: 32px 60px 64px;
    overflow-y: auto;
    overflow-x: hidden;
    /* When content exceeds viewport, allow scroll instead of clipping the bottom */
    scrollbar-width: thin;
    scrollbar-color: var(--line-strong) transparent;
  }
  .stage::-webkit-scrollbar { width: 8px; }
  .stage::-webkit-scrollbar-track { background: transparent; }
  .stage::-webkit-scrollbar-thumb {
    background: var(--line-strong);
    border-radius: 4px;
  }
  .stage::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  /* Viewport-locked variant: used for prompt screens and idea-cards so the bottom strip is always visible */
  .stage.fit-viewport { overflow: hidden; padding-top: clamp(20px, 3vh, 36px); padding-bottom: clamp(20px, 3vh, 36px); }
  .stage.fit-viewport .screen { height: 100%; display: flex; flex-direction: column; min-height: 0; }

  .screen {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    animation: fadeUp 0.42s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .label {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 14px;
  }

  /* ----- Welcome / session-start / session-end ----- */
  .hero {
    text-align: center;
    padding: 8px 0;
  }
  .hero-logo {
    display: block;
    width: 100px;
    height: auto;
    margin: 0 auto 20px;
    opacity: 0.98;
  }
  .hero-eyebrow {
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
    font-weight: 500;
  }
  .hero-title {
    font-family: var(--serif);
    font-size: clamp(56px, 8vw, 120px);
    font-weight: 300;
    line-height: 0.95;
    letter-spacing: -0.03em;
    margin-bottom: 18px;
  }
  .hero-title.brand {
    color: var(--accent);
    font-weight: 400;
  }
  .hero-sub {
    font-family: var(--serif);
    font-size: clamp(18px, 2.0vw, 28px);
    color: var(--text-soft);
    font-style: italic;
    font-weight: 300;
    letter-spacing: -0.005em;
    margin-bottom: 8px;
  }
  .hero-meta {
    color: var(--text-muted);
    font-size: 14px;
    letter-spacing: 0.04em;
    margin-top: 6px;
  }
  .hero-rule {
    width: 64px;
    height: 1px;
    background: var(--accent);
    margin: 24px auto;
    border: none;
  }
  .hero-rule.thin { width: 40px; opacity: 0.6; }

  .button-row {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  /* ----- Stage (set the stage) ----- */
  .stage-text {
    font-family: var(--serif);
    font-size: clamp(18px, 1.7vw, 24px);
    line-height: 1.45;
    color: var(--text);
    font-weight: 300;
    letter-spacing: -0.005em;
    max-width: 62ch;
  }
  .stage-text p {
    margin: 0 0 0.85em 0;
  }
  .stage-text p:last-child {
    margin-bottom: 0;
  }
  .facilitator-note {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px dashed var(--line);
    color: var(--text-muted);
    font-size: 13px;
    font-style: italic;
    letter-spacing: 0.01em;
    max-width: 62ch;
  }

  /* ----- Step (build SOP, one per screen) ----- */
  .step-screen { max-width: 64ch; }
  .step-head {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }
  .step-code {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #FFFFFF;
    background: var(--accent);
    padding: 4px 11px;
    border-radius: 6px;
  }
  .step-section-name {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
  }
  .step-title {
    font-family: var(--serif);
    font-size: clamp(30px, 4vw, 50px);
    font-weight: 400;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 14px;
  }
  .step-lead {
    font-family: var(--serif);
    font-size: clamp(17px, 1.6vw, 22px);
    line-height: 1.45;
    color: var(--text-soft);
    font-weight: 300;
    max-width: 58ch;
    margin-bottom: 18px;
  }
  .step-tool {
    margin-bottom: 18px;
  }
  .step-tool a, .step-tool {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  .step-tool a {
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--accent-soft);
    border-radius: 999px;
    padding: 6px 13px;
    background: rgba(193,125,42,0.06);
  }
  .step-tool a:hover { background: rgba(193,125,42,0.14); }
  .step-detail {
    list-style: none;
    margin: 0 0 4px 0;
    padding: 0;
    max-width: 60ch;
  }
  .step-detail li {
    display: flex;
    gap: 13px;
    align-items: flex-start;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-size: clamp(15px, 1.35vw, 18px);
    line-height: 1.5;
    color: var(--text);
  }
  .step-detail li:last-child { border-bottom: none; }
  .step-detail-num {
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    margin-top: 1px;
    border-radius: 50%;
    border: 1px solid var(--accent-soft);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .step-prompt {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 20px;
    padding: 14px 18px;
    border: 1px solid var(--accent-soft);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    background: rgba(193,125,42,0.06);
    max-width: 60ch;
  }
  .step-prompt-tag {
    flex: 0 0 auto;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #FFFFFF;
    background: var(--accent);
    padding: 5px 10px;
    border-radius: 5px;
  }
  .step-prompt-title {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 2px;
  }
  .step-prompt-where {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.02em;
    color: var(--text-muted);
  }

  /* ----- Question ----- */
  .question-title {
    font-family: var(--serif);
    font-size: clamp(32px, 4.2vw, 56px);
    font-weight: 400;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 20px;
  }
  .question-body {
    font-size: clamp(15px, 1.3vw, 19px);
    color: var(--text-soft);
    line-height: 1.55;
    max-width: 62ch;
    margin-bottom: 20px;
  }

  /* ----- HMV ----- */
  .hmv-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 16px;
  }
  .hmv-panel {
    background: var(--bg-elev-1);
    border: 1px solid var(--line);
    border-top: 2px solid var(--accent);
    padding: 18px 18px;
    border-radius: 2px;
  }
  .hmv-name {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 500;
    color: var(--accent);
    margin-bottom: 10px;
    letter-spacing: -0.01em;
  }
  .hmv-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .hmv-list li {
    font-size: 13px;
    color: var(--text-soft);
    line-height: 1.5;
    padding-left: 14px;
    position: relative;
  }
  .hmv-list li::before {
    content: "/";
    position: absolute;
    left: 0;
    color: var(--accent);
    font-weight: 500;
  }
  @media (max-width: 1000px) {
    .hmv-grid { grid-template-columns: 1fr; gap: 12px; }
  }

  /* ----- Prompt ----- */
  .prompt-title {
    font-family: var(--serif);
    font-size: clamp(24px, 2.8vw, 36px);
    font-weight: 400;
    letter-spacing: -0.015em;
    margin-bottom: 8px;
  }
  .prompt-tool {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 8px 14px;
    margin-bottom: 14px;
    font-size: 13px;
    color: var(--bg);
    box-shadow: 0 0 0 3px rgba(193, 125, 42, 0.18);
  }
  .prompt-tool::before {
    content: "USE";
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--bg);
    font-weight: 700;
    padding-right: 10px;
    border-right: 1px solid rgba(10, 10, 10, 0.4);
    opacity: 0.85;
  }
  .prompt-tool strong {
    color: var(--bg);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: -0.005em;
  }
  .prompt-box {
    background: #050505;
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    padding: 16px 20px;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.55;
    color: var(--text-soft);
    white-space: pre-wrap;
    word-break: break-word;
    border-radius: 2px;
    margin-bottom: 12px;
    max-height: 40vh;
    overflow-y: auto;
  }
  .prompt-box::-webkit-scrollbar { width: 8px; }
  .prompt-box::-webkit-scrollbar-track { background: transparent; }
  .prompt-box::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }

  .copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--accent);
    color: #FFFFFF;
    border: none;
    padding: 10px 22px;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.18s ease;
  }
  .copy-btn:hover { background: #D08A33; transform: translateY(-1px); }
  .copy-btn.copied { background: #2C8A4F; pointer-events: none; }

  /* ----- Prompt screen (viewport-locked, URL strip always visible) ----- */
  .prompt-screen {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
    padding: 8px 0;
  }
  .prompt-screen-header { flex: 0 0 auto; margin-bottom: clamp(8px, 1.2vh, 14px); }
  .prompt-screen-title {
    font-size: clamp(20px, 2.6vh, 28px) !important;
    margin: clamp(4px, 0.8vh, 10px) 0 clamp(4px, 0.6vh, 8px) !important;
  }
  .prompt-screen-box {
    flex: 1 1 auto !important;
    min-height: 0 !important;
    max-height: none !important;
    margin-bottom: 0 !important;
    font-size: clamp(13px, 1.65vh, 16px) !important;
    line-height: 1.6 !important;
    color: var(--text) !important;
    padding: 18px 24px !important;
  }
  .prompt-screen-footer {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 1.2vh, 14px);
    margin-top: clamp(10px, 1.5vh, 16px);
  }
  .prompt-laptop-line {
    padding: clamp(10px, 1.5vh, 14px) 22px;
    background: rgba(193,125,42,0.08);
    border: 1px solid var(--accent-soft);
    border-radius: 6px;
    text-align: center;
  }
  .prompt-laptop-eyebrow {
    font-size: 10.5px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 4px;
  }
  .prompt-laptop-url {
    font-family: var(--mono);
    font-size: clamp(14px, 1.9vh, 20px);
    color: var(--text);
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  /* ----- Build ----- */
  .build-list {
    list-style: none;
    counter-reset: build;
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 16px;
  }
  .build-item {
    counter-increment: build;
    display: grid;
    grid-template-columns: 42px 1fr;
    gap: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .build-item:last-child { border-bottom: none; padding-bottom: 0; }
  .build-item::before {
    content: counter(build, decimal-leading-zero);
    font-family: var(--serif);
    font-size: 22px;
    color: var(--accent);
    font-weight: 400;
    line-height: 1;
    padding-top: 3px;
  }
  .build-item h3 {
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 500;
    margin-bottom: 4px;
    letter-spacing: -0.01em;
  }
  .build-item p {
    color: var(--text-soft);
    font-size: 13px;
    line-height: 1.5;
  }

  /* For sessions with many build steps (6+), use two-column grid */
  .build-list.compact {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 28px;
  }
  .build-list.compact .build-item {
    padding-bottom: 8px;
    grid-template-columns: 32px 1fr;
    gap: 10px;
  }
  .build-list.compact .build-item::before {
    font-size: 18px;
  }
  .build-list.compact .build-item h3 {
    font-size: 15px;
  }
  .build-list.compact .build-item p {
    font-size: 12px;
    line-height: 1.45;
  }

  /* ----- Test Output ----- */
  .test-intro {
    color: var(--text-soft);
    font-size: 14px;
    margin-bottom: 14px;
  }
  .test-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 12px;
  }
  .test-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 14px;
    background: var(--bg-elev-1);
    border: 1px solid var(--line);
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .test-item:hover { border-color: var(--line-strong); }
  .test-item.checked {
    background: rgba(193, 125, 42, 0.08);
    border-color: var(--accent);
  }
  .checkbox {
    flex: 0 0 20px;
    width: 20px;
    height: 20px;
    border: 1.5px solid var(--text-muted);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 2px;
    transition: all 0.2s ease;
  }
  .test-item.checked .checkbox {
    background: var(--accent);
    border-color: var(--accent);
  }
  .checkbox svg {
    width: 12px;
    height: 12px;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .test-item.checked .checkbox svg { opacity: 1; }
  .test-content h4 {
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 3px;
    color: var(--text);
  }
  .test-content p {
    color: var(--text-soft);
    font-size: 13px;
    line-height: 1.5;
  }

  .all-checked-banner {
    display: none;
    text-align: center;
    padding: 28px;
    border: 1px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 2px;
    animation: fadeUp 0.4s ease;
  }
  .all-checked-banner.show { display: block; }

  /* ----- Break ----- */
  .break {
    text-align: center;
  }
  .break-timer {
    font-family: var(--mono);
    font-size: clamp(120px, 22vw, 280px);
    color: var(--accent);
    font-weight: 400;
    line-height: 1;
    letter-spacing: -0.04em;
    margin-bottom: 32px;
  }
  .break-label {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 300;
    color: var(--text-soft);
    font-style: italic;
  }
  .break-next {
    color: var(--text-muted);
    margin-top: 16px;
    font-size: 14px;
    letter-spacing: 0.04em;
  }
  .break-over {
    font-family: var(--serif);
    font-size: clamp(48px, 7vw, 96px);
    font-weight: 400;
  }

  /* ----- Buttons ----- */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 16px 36px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s ease;
    border: none;
    text-decoration: none;
  }
  .btn-primary {
    background: var(--accent);
    color: #FFFFFF;
  }
  .btn-primary:hover { background: #D08A33; transform: translateY(-1px); }
  .btn-ghost {
    background: transparent;
    color: var(--text-soft);
    border: 1px solid var(--line-strong);
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  /* ----- Bottom bar ----- */
  .bottombar {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 24px;
    padding: 16px 40px;
    border-top: 1px solid var(--line);
    background: var(--bg);
  }
  .bottombar.hidden { display: none; }

  .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 12px 22px;
    background: transparent;
    color: var(--text-soft);
    border: 1px solid var(--line-strong);
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s ease;
  }
  .nav-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
  }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .nav-prev { justify-self: start; }
  .nav-next { justify-self: end; }

  .hmv-reminder {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--serif);
    font-size: 14px;
    font-style: italic;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    cursor: pointer;
    user-select: none;
  }
  .hmv-reminder .letter {
    color: var(--accent);
    font-weight: 500;
    font-style: normal;
    font-family: var(--sans);
    letter-spacing: 0.32em;
  }
  .hmv-reminder .full {
    color: var(--text-muted);
    transition: opacity 0.2s ease;
  }
  .hmv-reminder.collapsed .full { display: none; }

  .keyboard-hint {
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.04em;
    margin-top: 4px;
    text-align: center;
  }
  .keyboard-hint kbd {
    font-family: var(--mono);
    background: var(--bg-elev-1);
    padding: 1px 6px;
    border-radius: 2px;
    border: 1px solid var(--line);
    font-size: 10px;
    color: var(--text-muted);
  }

  /* ----- Loading / error ----- */
  .loading, .error {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    padding: 40px;
  }
  .loading p, .error p {
    color: var(--text-muted);
    font-style: italic;
    font-family: var(--serif);
    font-size: 18px;
  }
  .error h2 {
    font-family: var(--serif);
    color: var(--danger);
    margin-bottom: 16px;
    font-weight: 400;
    font-size: 28px;
  }
  .error code {
    font-family: var(--mono);
    background: var(--bg-elev-1);
    padding: 2px 8px;
    border-radius: 2px;
    font-size: 13px;
    color: var(--accent);
  }

  /* ----- Responsive ----- */
  @media (max-width: 800px) {
    .topbar, .bottombar { padding: 14px 20px; }
    .stage { padding: 32px 24px; }
    .topbar { grid-template-columns: 1fr auto; gap: 16px; }
    .topbar-right { display: none; }
    .keyboard-hint { display: none; }
  }

  /* Subtle grain to add atmosphere on projection */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,0.012) 1px, transparent 1px);
    background-size: 3px 3px;
    z-index: 1;
  }

  /* ========================================
     Login Gate
     ======================================== */
  .login-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-overlay.hidden { display: none; }

  .login-card {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .login-eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
  }
  .login-title {
    font-family: var(--font-display);
    font-size: 56px;
    line-height: 0.95;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 8px;
  }
  .login-subtitle {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 36px;
  }
  .login-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .login-input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 14px 16px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    transition: border-color 160ms ease, background 160ms ease;
  }
  .login-input:focus {
    outline: none;
    border-color: var(--accent);
    background: rgba(255,255,255,0.06);
  }
  .login-input::placeholder { color: rgba(255,255,255,0.3); }

  .login-logo {
    display: block;
    width: 96px;
    height: auto;
    margin: 0 auto 24px;
    opacity: 0.95;
  }

  .login-submit {
    margin-top: 8px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 14px 20px;
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: opacity 160ms ease, transform 160ms ease;
  }
  .login-submit:hover { opacity: 0.9; }
  .login-submit:active { transform: scale(0.98); }
  .login-submit:disabled { opacity: 0.5; cursor: wait; }

  .login-error {
    color: #E07B6E;
    font-size: 13px;
    margin-top: 12px;
    min-height: 18px;
    opacity: 0;
    transition: opacity 160ms ease;
  }
  .login-error.show { opacity: 1; }

  @keyframes login-shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }
  .login-card.shake { animation: login-shake 320ms ease; }

  /* ============================================
     WELCOME LAYER (two-doors, journey-map, tools-landscape)
     ============================================ */
  .wl-screen {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px 8px;
    text-align: center;
  }
  .wl-eyebrow {
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
    font-weight: 500;
  }
  .wl-title {
    font-family: var(--serif);
    font-size: clamp(32px, 3.8vw, 48px);
    font-weight: 300;
    line-height: 1.02;
    letter-spacing: -0.025em;
    margin-bottom: 10px;
  }
  .wl-sub {
    font-family: var(--serif);
    font-size: clamp(14px, 1.2vw, 17px);
    color: var(--text-soft);
    font-style: italic;
    font-weight: 300;
    line-height: 1.45;
    max-width: 68ch;
    margin: 0 auto 18px;
  }
  .wl-footer {
    font-family: var(--serif);
    font-size: clamp(14px, 1.3vw, 17px);
    font-weight: 500;
    color: var(--text);
    margin-top: 14px;
    letter-spacing: -0.005em;
    padding-left: 12px;
    border-left: 3px solid var(--accent);
    display: inline-block;
    text-align: left;
  }

  /* ----- Two Doors ----- */
  .doors-grid {
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 18px;
    margin: 0;
    text-align: left;
    align-items: stretch;
  }
  .door {
    background: var(--bg-elev-1);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 22px 24px 24px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  .door-primary {
    border: 1px solid var(--accent);
    box-shadow: 0 0 0 4px rgba(193, 125, 42, 0.08), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .door-primary::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: var(--accent);
  }
  .door-secondary::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--line-strong);
  }
  .door-tag {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 14px;
    margin-top: 4px;
  }
  .door-secondary .door-tag { color: var(--text-muted); }
  .door-dot { color: var(--text-faint); margin: 0 4px; }
  .door-title {
    font-family: var(--serif);
    font-size: clamp(22px, 2.0vw, 28px);
    font-weight: 400;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
    color: var(--text);
  }
  .door-lede {
    font-family: var(--serif);
    font-style: italic;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text-soft);
    margin-bottom: 16px;
  }
  .door-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .door-list li {
    position: relative;
    padding: 6px 0 6px 20px;
    color: var(--text-soft);
    font-size: 14px;
    line-height: 1.45;
    border-bottom: 1px solid var(--line);
  }
  .door-list li:last-child { border-bottom: none; }
  .door-list li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 13px;
    width: 8px;
    height: 2px;
    background: var(--accent);
  }
  .door-secondary .door-list li::before { background: var(--text-muted); }

  /* ----- Journey Map ----- */
  .journey-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    text-align: left;
    max-width: 860px;
    margin: 0 auto;
  }
  .journey-col {
    background: var(--bg-elev-1);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 16px 20px;
  }
  .journey-day {
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .journey-list { list-style: none; margin: 0; padding: 0; }
  .journey-item {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 7px 0;
    border-bottom: 1px solid var(--line);
  }
  .journey-item:last-child { border-bottom: none; }
  .journey-num {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
    flex-shrink: 0;
    width: 22px;
  }
  .journey-body { display: flex; flex-direction: column; gap: 1px; }
  .journey-title {
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 400;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .journey-note {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.35;
  }
  .journey-outcome {
    margin-top: 18px;
    text-align: center;
  }
  .journey-arrow {
    font-size: 22px;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 6px;
  }
  .journey-outcome-label {
    font-family: var(--serif);
    font-size: clamp(18px, 1.9vw, 24px);
    font-weight: 400;
    color: var(--text);
    letter-spacing: -0.015em;
    margin-bottom: 4px;
  }
  .journey-outcome-url {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.02em;
  }


  /* ----- Journey Cover (dark metamorphosis slide, matches the deck) ----- */
  .journey-cover {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 24px 8px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .journey-cover-eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 14px;
  }
  .journey-cover-title {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 300;
    font-size: clamp(34px, 6vw, 76px);
    line-height: 1.0;
    letter-spacing: -0.02em;
    color: var(--text);
    margin: 0 0 14px;
  }
  .journey-cover-sub {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(15px, 1.9vw, 22px);
    color: var(--text-soft);
    margin: 0 0 6px;
  }
  .journey-cover-art {
    display: block;
    width: 100%;
    max-width: 1180px;
    max-height: 56vh;
    object-fit: contain;
    margin: 8px auto 6px;
  }
  .journey-cover-fallback {
    width: 100%;
    max-width: 760px;
    min-height: 200px;
    margin: 18px auto;
    border: 2px dashed var(--line-strong);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: var(--text-muted);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.7;
  }
  .journey-cover-footer {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(14px, 1.5vw, 19px);
    color: var(--text-soft);
    max-width: 980px;
    margin: 8px auto 0;
    line-height: 1.45;
  }

  /* ----- Tools Landscape ----- */
  .cat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    text-align: left;
  }
  .cat-card {
    background: var(--bg-elev-1);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
  }
  .cat-name {
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--text);
    margin-bottom: 2px;
  }
  .cat-use {
    font-size: 11px;

    margin-bottom: 8px;

  }
  @media (max-width: 580px) {
    .cat-grid { grid-template-columns: 1fr; }
  }

  /* ============================================
     INTERLUDES (cohort, photo, checkin, feedback, portfolio)
     ============================================ */
  .interlude-narrow { max-width: 760px; }

  .wl-quiet {
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 18px;
    font-style: italic;
  }

  /* ----- Housekeeping ----- */
  .hk-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px;
    text-align: left;
  }
  .hk-card {
    background: var(--bg-elev-1);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
  }
  .hk-label {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 12px;
  }
  .hk-list {
    list-style: none;
    margin: 0;
    padding: 0;
    flex: 1;
  }
  .hk-list li {
    position: relative;
    padding: 6px 0 6px 14px;
    color: var(--text-soft);

    line-height: 1.45;

    content: "·";

    top: 5px;

    font-size: 14px;
  }

  .hk-tools {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 10px;
  }
  .hk-tool {
    display: inline-block;
    padding: 4px 9px;
    font-size: 11px;

    border-radius: 12px;
    font-weight: 500;
  }
  .hk-note {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.4;
    font-style: italic;
    margin-top: auto;
  }
  @media (max-width: 900px) {
    .hk-grid { grid-template-columns: 1fr; }
  }

  /* ----- Outcomes (new Two Doors structure: 3 sections) ----- */
  .outcomes-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 16px;
    text-align: left;
  }
  .outcome {
    background: var(--bg-elev-1);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  .outcome-primary {
    border: 1px solid var(--accent);
    box-shadow: 0 0 0 4px rgba(193, 125, 42, 0.08);
    grid-column: 1;
    grid-row: 1;
  }
  .outcome-primary::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: var(--accent);
  }
  .outcome-secondary {
    grid-column: 2;
    grid-row: 1;
  }
  .outcome-secondary::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--line-strong);
  }
  .outcome-shared {
    grid-column: 1 / -1;
    grid-row: 2;
    border-color: var(--line-strong);
  }
  .outcome-shared::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--text-muted);
  }
  .outcome-tag {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 12px;
    margin-top: 4px;
  }
  .outcome-secondary .outcome-tag,
  .outcome-shared .outcome-tag { color: var(--text-muted); }
  .outcome-title {
    font-family: var(--serif);
    font-size: clamp(20px, 1.9vw, 26px);
    font-weight: 400;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
    color: var(--text);
  }
  .outcome-lede {
    font-family: var(--serif);
    font-style: italic;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text-soft);
  }
  .outcome-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .outcome-list li {
    position: relative;
    padding: 6px 0 6px 20px;
    color: var(--text-soft);
    font-size: 14px;
    line-height: 1.45;
    border-bottom: 1px solid var(--line);
  }
  .outcome-list li:last-child { border-bottom: none; }
  .outcome-list li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 13px;
    width: 8px;
    height: 2px;
    background: var(--accent);
  }
  .shared-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .shared-item {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 6px 12px;
    font-size: 13px;
    color: var(--text-soft);
  }
  @media (max-width: 900px) {
    .outcomes-grid {
      grid-template-columns: 1fr;
    }
    .outcome-primary, .outcome-secondary, .outcome-shared {
      grid-column: 1;
      grid-row: auto;
    }
  }

  /* ----- Timeline (new Workshop Complete structure) ----- */
  .timeline {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    text-align: left;
  }
  .timeline-row {
    display: grid;
    grid-template-columns: 160px 1fr;
    gap: 24px;
    align-items: start;
    background: var(--bg-elev-1);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 18px 22px;
  }
  .timeline-when {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    padding-top: 2px;
  }
  .timeline-title {
    font-family: var(--serif);
    font-size: clamp(17px, 1.7vw, 22px);

    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }
  .timeline-detail {
    font-size: 14px;
    color: var(--text-soft);
    line-height: 1.55;
  }
  @media (max-width: 700px) {
    .timeline-row {
      grid-template-columns: 1fr;
      gap: 8px;
    }

  /* ----- Day 1 Photo ----- */
  .photo-icon {
    margin: 8px auto 24px;
    width: 110px;
  }

  .d2-recap {
    display: grid;

    align-items: stretch;
    max-width: 640px;
    margin: 0 auto;
    text-align: left;
  }
  .d2-recap-half {
    padding: 0;
  }
  .d2-recap-ahead {
    padding-left: 8px;
  }
  .d2-recap-divider {
    width: 1px;
    background: var(--line);
  }
  .d2-recap-label {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 12px;
  }
  .d2-recap-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .d2-recap-list li {
    padding: 6px 0 6px 18px;
    color: var(--text-soft);
    font-size: 15px;
    line-height: 1.4;
    position: relative;
  }
  .d2-recap-list li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 14px;
    width: 8px;
    height: 2px;
    background: var(--accent);
  }
  .d2-recap-half:not(.d2-recap-ahead) .d2-recap-list li {
    color: var(--text-muted);
  }
  .d2-recap-half:not(.d2-recap-ahead) .d2-recap-list li::before {
    background: var(--text-faint);
  }

  /* ----- Feedback Prompt (group activity, no inputs) ----- */
  .feedback-question {
    max-width: 640px;
    margin: 0 auto;
    background: var(--bg-elev-1);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 26px 32px;
    text-align: center;
  }
  .feedback-question-text {
    font-family: var(--serif);
    font-size: clamp(20px, 2.2vw, 28px);
    font-weight: 400;
    color: var(--text);
    line-height: 1.35;
    letter-spacing: -0.01em;
  }

  /* ----- Portfolio Reveal ----- */
  .portfolio-screen { max-width: 1100px; }

  .portfolio-hero {
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 24px 28px 22px;
    margin-bottom: 28px;
    background: linear-gradient(180deg, rgba(193,125,42,0.05), rgba(193,125,42,0.01));
    position: relative;
    overflow: hidden;
  }
  .portfolio-hero::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: var(--accent);
  }
  .portfolio-hero-label {
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 12px;
    margin-top: 4px;
  }
  .portfolio-hero-url {
    font-family: var(--mono);
    font-size: clamp(15px, 1.8vw, 22px);
    color: var(--text);
    font-weight: 500;
    word-break: break-all;
    margin-bottom: 14px;
    line-height: 1.35;
    letter-spacing: -0.005em;
  }
  .portfolio-hero-slot {
    color: var(--accent);
    font-style: normal;
  }
  .portfolio-hero-note {
    font-size: 14px;
    color: var(--text-soft);
    line-height: 1.55;
    max-width: 70ch;
    margin: 0 auto;
    font-style: italic;
  }

  .portfolio-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 8px;
    text-align: left;
  }
  .portfolio-card {
    background: var(--bg-elev-1);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 16px 18px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    transition: border-color 160ms ease;
  }
  .portfolio-card:hover { border-color: var(--line-strong); }
  .portfolio-num {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    flex-shrink: 0;
    margin-top: 3px;
    font-weight: 600;
    letter-spacing: 0.06em;
  }
  .portfolio-body { flex: 1; min-width: 0; }
  .portfolio-label {
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 2px;
    letter-spacing: -0.01em;
  }
  .portfolio-note {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .portfolio-placeholder {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
    word-break: break-all;
    line-height: 1.4;
  }

  /* ----- Output Capture ----- */
  .capture-screen {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px;
  }
  .capture-title {
    font-family: var(--serif);
    font-size: clamp(28px, 3.2vw, 40px);
    font-weight: 400;
    letter-spacing: -0.015em;
    margin-bottom: 8px;
  }
  .capture-arrow {
    color: var(--accent);
    font-weight: 300;
    margin: 0 6px;
  }
  .capture-ask {
    font-family: var(--serif);
    font-size: 17px;
    font-style: italic;
    color: var(--text-soft);
    margin-bottom: 20px;
    line-height: 1.5;
  }
  .capture-instruction {
    background: var(--bg-elev-1);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 0 6px 6px 0;
    padding: 18px 22px;
    margin-bottom: 16px;
  }
  .capture-instruction-step {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 8px 0;
    color: var(--text-soft);
    font-size: 15px;
    line-height: 1.5;
    border-bottom: 1px solid var(--line);
  }
  .capture-instruction-step:last-child { border-bottom: none; }
  .capture-instruction-num {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--bg);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 700;
    margin-top: 1px;

  .capture-guidance {
    background: var(--bg-elev-1);
    border-left: 3px solid var(--accent);
    padding: 14px 18px;
    border-radius: 0 4px 4px 0;
    font-size: 14px;
    color: var(--text-soft);
    line-height: 1.55;
    font-style: italic;
  }

  /* ============================================
     IDEA CARDS (24 ideas across 3 pages, 8 per page, 4×2 grid)
     ============================================ */
  .ideas-screen {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
    padding: 8px 0;
  }
  .ideas-screen-header {
    flex: 0 0 auto;
    margin-bottom: clamp(10px, 1.6vh, 18px);
  }
  .ideas-screen-eyebrow {
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
    margin-bottom: clamp(8px, 1.2vh, 14px);
  }
  .ideas-screen-title {
    font-family: var(--serif);
    font-size: clamp(22px, 3.4vh, 36px);
    font-weight: 300;
    letter-spacing: -0.025em;
    line-height: 1.05;
    margin-bottom: clamp(6px, 1vh, 12px);
    max-width: 32ch;
  }
  .ideas-screen-title em {
    color: var(--accent);
    font-style: italic;
    font-weight: 400;
  }
  .ideas-screen-sub {
    font-family: var(--serif);
    font-size: clamp(12px, 1.5vh, 15px);
    font-style: italic;
    line-height: 1.4;
    color: var(--text-soft);
    font-weight: 300;
    max-width: 60ch;
  }
  .idea-set-switcher {
    display: flex;
    gap: 8px;
    margin-top: clamp(10px, 1.4vh, 16px);
    flex-wrap: wrap;
  }
  .idea-set-pill {
    background: var(--bg-elev-1);
    color: var(--text-soft);
    border: 1px solid var(--line-strong);
    padding: 7px 16px;
    border-radius: 999px;
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .idea-set-pill:hover {
    color: var(--accent);
    border-color: var(--accent-soft);
    background: rgba(193,125,42,0.04);
  }
  .idea-set-pill.active {
    background: var(--accent);
    color: #FFFFFF;
    border-color: var(--accent);
  }
  .idea-set-pill.active:hover {
    background: #A86A24;
    border-color: #A86A24;
    color: #FFFFFF;
  }
  .idea-set-pill-count {
    font-family: var(--mono);
    font-size: 10.5px;
    opacity: 0.7;
    letter-spacing: 0.04em;
  }
  .ideas-grid {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: clamp(8px, 1vh, 12px);
    margin: 0;
    overflow: hidden;
  }
  .idea-card {
    background: var(--bg-elev-1);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: clamp(10px, 1.5vh, 14px) clamp(10px, 1.4vh, 14px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: border-color 0.2s, background 0.2s;
  }
  .idea-card:hover { border-color: var(--accent-soft); }
  .idea-card-num {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.16em;
    color: var(--accent);
    margin-bottom: 3px;
    flex-shrink: 0;
  }
  .idea-card-name {
    font-family: var(--serif);
    font-size: clamp(14px, 2vh, 18px);
    font-weight: 500;
    color: var(--text);
    margin-bottom: clamp(6px, 1vh, 10px);
    letter-spacing: -0.01em;
    line-height: 1.1;
    flex-shrink: 0;
  }
  .idea-card-row { margin-bottom: clamp(5px, 0.8vh, 8px); }
  .idea-card-row:last-child { margin-bottom: 0; }
  .idea-card-label {
    font-size: 8.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 500;
    margin-bottom: 1px;
  }
  .idea-card-value {
    font-size: clamp(10.5px, 1.25vh, 12px);
    line-height: 1.4;
    color: var(--text-soft);

  @media (max-width: 1100px) {
    .ideas-grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(4, 1fr); }
  }
  @media (max-width: 600px) {
    .ideas-grid { grid-template-columns: 1fr; grid-template-rows: auto; }
  }

  /* ============================================
     CLOSING / INSPIRATIONAL
     ============================================ */
  .closing-screen {
    text-align: center;
    padding: 24px 24px 48px;
    max-width: 760px;
    margin: 0 auto;
  }
  .closing-logo {
    display: block;
    width: clamp(160px, 22vw, 280px);
    height: auto;
    margin: 0 auto 36px;

  .closing-eyebrow {
    font-size: 12px;

    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 22px;
    font-weight: 500;
  }
  .closing-title {
    font-family: var(--serif);
    font-size: clamp(52px, 7vw, 92px);
    font-weight: 300;
    line-height: 1.0;
    letter-spacing: -0.03em;
    color: var(--text);
    margin-bottom: 24px;
  }
  .closing-sub {
    font-family: var(--serif);
    font-size: clamp(17px, 1.6vw, 22px);
    color: var(--text-soft);
    font-style: italic;
    font-weight: 300;
    line-height: 1.5;
    max-width: 60ch;

  .fit-viewport .concept-slide { height:100%; justify-content:center; overflow:hidden; max-width:78ch; }

  .fit-viewport .concept-headline { font-size: clamp(26px, 2.1vw + 1.5vh, 46px) !important; margin-bottom: min(14px,1.9vh) !important; }
  .fit-viewport .concept-lens-tag { margin-bottom: min(12px,1.7vh) !important; }
  .fit-viewport .concept-lead { font-size: clamp(15px, 0.7vw + 0.85vh, 20px) !important; margin-bottom: min(12px,1.6vh) !important; }

<script>
/* ============================================
   Just Build  /  Workshop Platform
   ============================================ */

let WORKSHOP = null;          // sessions-college-foundation.json workshop block
let SESSIONS = [];            // sessions array
let IDEAS = [];               // ideas array (top-level of sessions-college-foundation.json)

// ---- Concept modules: HMV teaching slides inserted before a stage's sessions ----
const CONCEPT_PROPS = {
  glass: '<svg width="44" height="44" viewBox="0 0 46 46"><circle cx="19" cy="19" r="12" fill="none" stroke="#E8B53A" stroke-width="3"/><line x1="28" y1="28" x2="40" y2="40" stroke="#E8B53A" stroke-width="4" stroke-linecap="round"/></svg>',
  hat:   '<svg width="48" height="38" viewBox="0 0 50 40"><path d="M6 30 Q25 6 44 30 Z" fill="#C17D2A"/><rect x="2" y="30" width="46" height="6" rx="3" fill="#9c641f"/><rect x="22" y="9" width="6" height="14" rx="3" fill="#9c641f"/></svg>',
  coin:  '<svg width="44" height="44" viewBox="0 0 46 46"><ellipse cx="23" cy="34" rx="15" ry="6" fill="#6FBF8B"/><ellipse cx="23" cy="24" rx="15" ry="6" fill="#7fd49b"/><ellipse cx="23" cy="14" rx="15" ry="6" fill="#8fe0aa"/><text x="23" y="18" text-anchor="middle" font-family="monospace" font-size="11" fill="#0A0A0A" font-weight="700">&#8377;</text></svg>'
};

const CONCEPT_MODULES = {
  "agents": {
    "before_session": "1", "stage_number": "01", "stage_name": "Agents",
    "slides": [
      {"kicker":"THE ANATOMY","headline":"The *anatomy* of an agent","lead":"An agent is not one clever brain that works everything out. It is an assembly line: work goes in one end, passes through a few simple stations, and a finished result comes out the other.","steps":[{"title":"Built from parts","detail":"each stage does one small job you can watch"},{"title":"Easy to inspect","detail":"when the output is wrong, open the one station that failed"},{"title":"You are the designer","detail":"designing the stations is the real work, not the prompt"}],"wrong":"One prompt: 'Take this invoice and handle it.' The model reads, judges and emails the vendor in one step. When it fails, you cannot tell which part broke.","right":"Four stations: read, extract, apply the rule, draft. If something is off, you know exactly which station to open.","bubble":"Not a brain. <b>A well-built line.</b>"},
      {"kicker":"THE FOUR MOVES","headline":"Every agent is *four moves*","steps":[{"title":"Read","detail":"take in the raw input: an email, a PDF, a ticket, a report"},{"title":"Extract","detail":"pull out the few signals that actually matter"},{"title":"Decide","detail":"apply the rule"},{"title":"Act","detail":"draft the reply, or flag the exception"}],"wrong":"Combine two moves into one: ask 'Is this invoice fine to pay?' so the model reads and decides together. Now there is no clean fact to check and no rule to point to.","right":"Extract returns clean facts: amount ₹42,000, dated yesterday, vendor 'XYZ Traders', on the approved list is false. Decide works only from these.","bubble":"The skill is not the machine. It is <b>who works which station.</b>"},
      {"kicker":"THE ONE DECISION","headline":"What *runs where?*","lead":"A demo runs once, on clean input, with you watching. Production runs thousands of times, on messy input, with nobody watching. The whole craft is turning the first into the second.","steps":["A demo rewards *cleverness*","Production rewards *structure*","So the one real decision is this: which move runs in the *model*, and which in *code*?"],"wrong":"It cleared the three sample invoices in the demo, so it was shipped. Invoice number 47 arrives as a scanned photo with the total written by hand, and it is approved silently.","right":"First run it on 200 real invoices: the scanned ones, the foreign-currency ones, the duplicates. You find the failures on your own terms, not the vendor's.","bubble":"Get this wrong and it <b>fails the moment nobody is watching.</b>"},
      {"kicker":"MODEL OR CODE?","headline":"Model or code? *A simple test*","lead":"Do not ask the model to do what code does better. Once you see the split, the choice is obvious.","steps":[{"title":"Give it to the model","detail":"reading, extracting, classifying, summarising, drafting, and soft calls like 'is this a good fit?'"},{"title":"Give it to code","detail":"counting, dates, money, thresholds, routing, and any rule that must always hold"},{"title":"Cross this line and it breaks","detail":"almost every silent failure is a decision handed to the wrong one"}],"wrong":"'Add up the line items and check they match the total.' The model does the arithmetic, and on some invoices it returns ₹41,900 against ₹42,000, and nobody notices.","right":"The model only reads out each line-item figure. Code adds them and compares. Calculation goes where calculation is exact.","bubble":"One right answer? <b>Code.</b> Reading meaning? <b>The model.</b>"},
      {"kicker":"WHY THEY DIFFER","headline":"They are good at *opposite things*","steps":[{"title":"The model","detail":"turns messy language into clean facts, and nothing else does this as well"},{"title":"The model cannot","detail":"stay consistent, explain its reasons, or hold a hard rule on demand"},{"title":"Code","detail":"same input, same output, every time, and it points to the exact rule that fired"}],"wrong":"The manager asks why an invoice was held. The only honest answer is 'the model flagged it', which is no answer and will not survive an audit.","right":"'Held because the vendor XYZ Traders is not on the approved list, rule L-03.' You can point to the exact line that fired.","bubble":"Do not fight their nature. Give each <b>the job it is built for.</b>","note":{"label":"In practice","text":"Not a bug: the model samples from probabilities, so the same input can vary, and the reason it gives is a plausible guess, not proof."}},
      {"kicker":"THE RULE","headline":"Put the *reading* in the model. Put the *deciding* in code.","lead":"Rules, not guesswork.","wrong":"Prompt: 'Approve invoices below ₹50,000 from approved vendors.' You are trusting the model to check the limit and the list. It will be right most of the time, and that is the dangerous kind of right.","right":"The model returns amount ₹42,000, on-list false. Code decides: if the amount is below ₹50,000 and the vendor is on the list, approve. The same answer on every run.","bubble":"The model reads. <b>Code decides.</b>","note":{"label":"In practice","text":"This holds when you can actually write the policy. When the judgement is genuinely open-ended and cannot be written as rules, that is either a poor fit for an agent, or a place a human stays."}},
      {"kicker":"WHEN NOT TO BUILD","headline":"Sometimes the answer is *no agent*","lead":"An agent is a tool, not a goal in itself. Half of the skill is knowing when to reach for something simpler.","steps":[{"title":"Data already clean, rules fixed","detail":"just write ordinary code; a model only adds cost and randomness here"},{"title":"No way to check the answer","detail":"if you cannot tell right from wrong, do not hand it to a machine"},{"title":"A one-time job","detail":"building the agent costs more than simply doing it once by hand"}],"wrong":"A fixed form with ten labelled fields and a clear formula. Someone builds an agent to 'read' it, and now a simple, exact task is slow and sometimes wrong.","right":"The same form goes to ten lines of ordinary code: instant, exact, and free of surprises. Save the agent for the messy inputs.","bubble":"The best agent is often <b>no agent.</b>"},
      {"kicker":"THE SHAPE YOU'LL BUILD","headline":"Same shape, *every stack*","lead":"The four moves become three agents: reading and extracting are one model call, deciding is code, and drafting is a model call.","steps":[{"title":"Agent 1 · Reader","detail":"a model. It reads and extracts the signals. It never decides."},{"title":"Agent 2 · Decider","detail":"plain code. It applies the rules and the hard rule. Fully auditable."},{"title":"Agent 3 · Drafter","detail":"a model. It writes the reply, but never sends. A human gives the final approval."}],"wrong":"One agent reads the invoice, scores it, and emails the vendor 'Payment approved' on its own. A made-up approval has just gone out in your company's name.","right":"Agent 1 extracts the fields, Agent 2 scores and applies the hard rule in code, Agent 3 drafts the email, and a person reads it and clicks send.","bubble":"Read with the model. Decide with code. <b>Draft, then gate.</b>"},
      {"kicker":"IT FAILS CONFIDENTLY","headline":"It sounds sure, even when it is *wrong*","lead":"This is the one failure you design around, not the one you hope away.","steps":[{"title":"It never says 'I am not sure'","detail":"a wrong answer arrives with exactly the same confidence as a right one"},{"title":"It fails silently","detail":"nothing turns red; the mistake looks just like success"},{"title":"So a named human owns it","detail":"on anything touching people, money or safety, a person approves before it goes out; 'the AI decided' is never an answer"}],"wrong":"The agent reports the wrong invoice total, the note reads perfectly, and it is sent automatically. Nobody checks, because nothing looked wrong.","right":"The agent shows the total and the exact line it came from, and a person approves before the payment goes out.","bubble":"Confident is <b>not the same as correct.</b>"},
      {"kicker":"THE STRONGEST OBJECTION","headline":"But won't the models just get *good enough?*","lead":"The sharpest argument against everything so far: models are improving fast, so soon we can drop the code and the gates and let the model handle it end to end. Take it seriously.","steps":[{"title":"Capability is rising, yes","detail":"the model will read and judge better every year; that part of the argument is simply correct"},{"title":"But this was never about cleverness","detail":"code, audits and the human gate exist for consistency, accountability and consequences, not because the model is not smart enough"},{"title":"A stronger model raises the stakes","detail":"the same silent, confident error now acts faster and reaches further, so the guardrails matter more, not less"}],"bubble":"Smarter model. <b>Same need for guardrails.</b>"},
      {"kicker":"YOUR TURN","headline":"Design the *complaint sorter*","lead":"A home-appliance company receives about 500 complaint emails every week. Today the team reads them in the order they arrive, so a minor complaint gets answered while a serious safety report waits for days. Build an agent that sorts the inbox so the important ones come up first.","paras":["The emails are free text. A few name a product model, and a few contain a line like 'it gave me a shock' or 'the base started smoking'. About 5% report injury or fire, and these can never wait in a queue."],"steps":["What should the *model* read?","What decision runs in *code*?","What is the one *hard rule*?","Where does a *human* stay in the loop?"],"bubble":"Design it before you <b>see the answer.</b>","caselet":true},
      {"kicker":"THE ANSWER","headline":"How the sorter *comes together*","lead":"Nothing here is new. It is the four moves, the line and the gate, applied once.","steps":[{"title":"The model reads","detail":"issue type, product, tone, and harm words; messy free text is its job"},{"title":"Code scores and routes","detail":"one urgency score, then route each email; routing has one right answer"},{"title":"One hard rule overrides","detail":"any harm word jumps the queue, whatever the score; the 5% can never be buried"},{"title":"A human sends","detail":"the agent drafts, a person approves; it touches a customer and the brand"}],"bubble":"New problem. <b>Same shape.</b>","caselet":true,"note":{"label":"A caveat","text":"Consistency checks catch inconsistency, not unfairness. A biased score is consistently biased, so fairness needs its own separate review."}}
    ]
  },
  "humanics": {
    "before_session": "2", "stage_number": "02", "stage_name": "Humanics",
    "slides": [
      {"kicker":"BEFORE THE TOOL, THE THINKING","headline":"The agent is decided *before you prompt*","lead":"The quality of an agent is settled long before you write a single prompt, in how clearly you have thought the problem through. The build is the easy part; the thinking is the whole job.","steps":[{"title":"The tool is the last step","detail":"Colab, Gemini, the code all come after the thinking is done"},{"title":"Clear thinking, clean build","detail":"a well-framed problem almost builds itself; a fuzzy one never does"},{"title":"A skill, not a trick","detail":"the habits here work on any problem, with or without AI"}],"wrong":"Open Colab, start prompting, and 'see what the model can do'. Three hours later there is a clever demo that solves a problem nobody actually had.","right":"Spend the first hour with a notebook and a pen. Name the real problem, then let the build follow the thinking.","bubble":"The build is easy. <b>The thinking is the job.</b>"},
      {"kicker":"ASK WHY","headline":"Keep asking *why* until it stops","steps":[{"title":"The surface ask","detail":"'Shortlist these 25 resumes.' Fine, but why?"},{"title":"One why deeper","detail":"to interview fewer, stronger people and waste less of the panel's time"},{"title":"Build for the real goal","detail":"now 'strong' and 'worth interviewing' become what your agent must actually judge"}],"wrong":"Take 'shortlist resumes' at face value and build a keyword matcher. It returns whoever used the right words, not whoever can do the job.","right":"Ask why first: the goal is fewer, better interviews. So the agent judges evidence of skill, not the presence of keywords.","note":{"label":"In practice","text":"This is first-principles thinking: reasoning up from the real goal instead of down from the inherited request. It is the habit under every good design."},"bubble":"Build for the reason, <b>not the request.</b>"},
      {"kicker":"FRAME THE QUESTION","headline":"A sharp *question* beats a clever answer","steps":[{"title":"Vague in, vague out","detail":"'Make hiring better with AI' cannot be built, because it cannot be answered"},{"title":"Make it precise","detail":"'from 25 resumes and one job description, return the best 5, with the evidence for each'"},{"title":"The frame is the design","detail":"a sharp question already tells you the inputs, the output, and the test"}],"wrong":"Start from 'improve our hiring'. Every meeting reopens what that even means, and nothing gets built.","right":"Start from 'top 5 of 25, with reasons'. The scope is fixed, the output is clear, and the work is obvious.","note":{"label":"In practice","text":"This is problem framing, where most of the leverage in the whole project sits. Time spent sharpening the question pays back many times over in the build."},"bubble":"Frame it sharp. <b>Build it easy.</b>"},
      {"kicker":"BREAK IT INTO ATOMS","headline":"Break the job into *atoms*","steps":[{"title":"Too big to build","detail":"'shortlist resumes' is one giant, fuzzy leap"},{"title":"Small enough to build","detail":"read the resume, pull six facts, score against four criteria, rank"},{"title":"You have seen this shape","detail":"those atoms are exactly read, extract, decide, act from the Agents session"}],"wrong":"Ask the model to 'read all 25 and give me the best 5' in one prompt. You cannot see or fix any single step when it goes wrong.","right":"Split it into named steps. Now each one is small, testable, and maps straight onto the agents you will build.","note":{"label":"In practice","text":"This is decomposition, the core move that turns any hard task into a buildable one. You will get the split wrong the first time and sharpen it; that is normal, not failure."},"bubble":"Big leap, no. <b>Small atoms, yes.</b>"},
      {"kicker":"DEFINE GOOD","headline":"Decide what *good* looks like, first","steps":[{"title":"A feeling does not scale","detail":"'I will know a good hire when I see it' cannot be tested or trusted"},{"title":"A test does","detail":"'good = three years hands-on, a real tool used, and proof of impact'"},{"title":"Do it by hand once","detail":"shortlist five yourself; that answer becomes the yardstick the agent must match"}],"wrong":"Build the agent, then judge its picks on gut feel. When you disagree, you have no way to say who is right.","right":"Write your own top five first. Now the agent either matches your yardstick or shows you exactly where it differs.","note":{"label":"In practice","text":"Not everything good reduces to a number. Measure what you honestly can, and keep the rest as an explicit human judgement rather than pretending it is a score."},"bubble":"Name 'good' <b>before you build.</b>"},
      {"kicker":"SEE THE WHOLE SYSTEM","headline":"See the whole *pipe*, not one clever step","steps":[{"title":"Weakest step wins","detail":"a perfect scorer fed junk facts produces junk, confidently"},{"title":"Every choice has a ripple","detail":"weight experience too hard and you quietly reject strong fresh talent"},{"title":"Think past the obvious","detail":"ask what a rule does to the cases you are not even looking at"}],"wrong":"Pour all your effort into a genius scoring prompt while the extract step quietly drops half the facts. The genius never gets a chance.","right":"Strengthen the weakest stage first. A clean extract feeding a plain scorer beats a genius scorer fed noise.","note":{"label":"In practice","text":"This is systems thinking: judging the whole chain and its side effects, not one step alone. Most real failures live in the joins, not the steps."},"bubble":"Mind the <b>whole pipe.</b>"},
      {"kicker":"PLAN FOR THE MESS","headline":"Run a *premortem* before you build","steps":[{"title":"Assume the bad day","detail":"the messy resume, the scanned PDF, the blank field, the odd format"},{"title":"Ask for evidence","detail":"make every claim show the line it came from, so a wrong pick is easy to catch"},{"title":"Try the mess on purpose","detail":"feed it the awkward cases yourself, before the real world does"}],"wrong":"Test on three clean resumes, decide 'it works', and ship. The first messy CV in the real batch breaks it silently.","right":"Test on the ugliest ten you can find. If it survives those, the clean ones were never the risk.","note":{"label":"Match rigour to stakes","text":"More thinking is not always better. A premortem earns its place on a real, repeated task; on a genuine one-off, doing it by hand is smarter."},"bubble":"Design for the <b>bad day.</b>"},
      {"kicker":"THE OBJECTION","headline":"Why think so hard? Can't I just *prompt and iterate?*","lead":"The sharpest push-back: models are forgiving, so why not just open Colab, try a prompt, and tweak until it looks right?","steps":[{"title":"Iteration is good","detail":"trying, checking, adjusting is exactly how good agents get better"},{"title":"But it needs a target","detail":"without a defined 'good', tweaking is not progress, it is thrashing in a circle"},{"title":"The thinking is the target","detail":"the real goal, the sharp question, the yardstick: that is what iteration aims at"}],"wrong":"Iterate on gut feel: change the prompt, glance at the output, 'feels better', repeat. You drift for hours with nothing to prove you improved.","right":"Iterate against your yardstick: each change either matches your top five better or it does not. Now iteration is real progress.","bubble":"Iteration needs <b>something to aim at.</b>"},
      {"kicker":"YOUR TURN","caselet":true,"headline":"Think through the *enquiry desk*","lead":"The college office says: 'Let us use AI to handle admission enquiries.' That is the whole brief. Before anyone opens Colab, do the thinking.","paras":["Every day the office gets hundreds of messages: fee questions, deadline questions, eligibility doubts, hostel queries, a few anxious parents, and the occasional genuine emergency. Some are simple and repeat constantly; a few are sensitive and must reach a real person."],"steps":["What is the *real goal* behind the request?","Frame it as one *sharp question*","Break it into *atoms*","What does *good* look like, and how would it *fail?*"],"bubble":"Think it through before you <b>touch the tool.</b>"},
      {"kicker":"THE ANSWER","caselet":true,"headline":"How the thinking *comes together*","lead":"Nothing new here. It is the same habits, applied to a fresh problem.","steps":[{"title":"The real goal","detail":"answer the common questions fast, and route the rest to a human quickly"},{"title":"The sharp question","detail":"'is this a known type we can answer, and if so, what is the correct official answer?'"},{"title":"The atoms","detail":"read, classify, fetch the official answer, decide answer-or-route, draft"},{"title":"Good, and how it fails","detail":"correct, current answers; a confident wrong answer on fees or eligibility must route to a human"}],"note":{"label":"A caveat","text":"An emergency message is not a knowledge question. Anything sensitive goes straight to a person, whatever the classifier says."},"bubble":"New problem. <b>Same habits.</b>"},
      {"kicker":"THE THINKING OUTLASTS THE TOOL","headline":"This is *thinking*, not prompting","lead":"The models will change every few months, and prompts you write today will be out of date by next year. But asking why, framing sharply, breaking into atoms, defining good, and planning for the mess: these do not expire.","steps":[{"title":"Tools churn","detail":"today's model, syntax and platform will all be replaced"},{"title":"The thinking stays","detail":"this is how a good engineer thought long before AI, and how they will think after"},{"title":"So it comes first","detail":"which is why Humanics sits before the build, not after"}],"bubble":"Tools change. <b>This way of thinking does not.</b>"}
    ]
  },
  "mechanics": {

      {"kicker":"RECRUIT BY HAND","caselet":"Hands on","headline":"Do it *yourself*, first","lead":"Before you build an agent to shortlist resumes, you will do the job by hand. This is not busywork: doing it yourself is how you learn what 'good' looks like and where the real judgement lives.","steps":[{"title":"You cannot automate what you cannot do","detail":"if you cannot shortlist five yourself, no agent can do it for you"},{"title":"Your answer becomes the test","detail":"the five you pick by hand are the yardstick the agent must later match"},{"title":"Feel where judgement lives","detail":"notice the moments you weigh, doubt and decide; that is what you will design"}],"bubble":"Do it by hand. <b>Then automate it.</b>"},
